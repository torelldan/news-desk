<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>News Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050605'/%3E%3Crect x='2' y='3' width='8' height='10' fill='%2339ff14'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=VT323&amp;display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000000;
    --ink: #7dff6b;
    --bright: #d6ffc8;
    --dim: #1f7a32;
    --green: #39ff14;
    --line: #14521f;
    --panel: rgba(0, 0, 0, 0.94);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    min-height: 100%;
    background: #000;
  }
  body::before {
    content: "";
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 40;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.16) 0px,
      rgba(0, 0, 0, 0.16) 1px,
      transparent 2px,
      transparent 4px
    );
    opacity: 0.28;
  }
  a { color: var(--green); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { color: var(--bright); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .paper {
    position: relative;
    z-index: 1;
    max-width: 1120px;
    margin: 22px auto 48px;
    padding: 22px 18px 36px;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .tick { position: absolute; width: 12px; height: 12px; border: 2px solid var(--green); }
  .tick.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .tick.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .tick.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .tick.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .mast {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 18px;
    align-items: end;
    border-top: 3px solid var(--green);
    border-bottom: 3px solid var(--green);
    padding: 12px 0 14px;
  }
  .kicker {
    margin: 0;
    color: var(--bright);
    letter-spacing: 0.22em;
    font-size: 12px;
  }
  h1, h2, .kicker, .wordmark { font-family: "VT323", ui-monospace, monospace; }
  .wordmark {
    margin: 0;
    font-size: clamp(42px, 8vw, 84px);
    line-height: 0.85;
    letter-spacing: 0.04em;
    color: var(--green);
    position: relative;
  }
  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 0.85em;
    margin-left: 4px;
    background: var(--green);
    vertical-align: baseline;
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  .sub { margin: 6px 0 0; color: var(--dim); letter-spacing: 0.12em; font-size: 12px; text-transform: uppercase; }
  .tools { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  .tools input {
    background: #070907;
    border: 1px solid var(--line);
    padding: 8px 10px;
    min-width: min(320px, 70vw);
  }
  a.refresh {
    display: inline-block;
    border: 1px solid var(--green);
    color: var(--bright);
    text-decoration: none;
    padding: 8px 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  a.refresh:hover { background: var(--green); color: #000; }
  .checked { grid-column: 1 / -1; color: var(--dim); font-size: 13px; }
  .banner {
    margin: 12px 0 0;
    border: 1px solid var(--green);
    color: var(--bright);
    padding: 8px 10px;
    letter-spacing: 0.08em;
  }
  .front {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px;
    margin-top: 8px;
    align-items: start;
  }
  .side { display: grid; gap: 8px; align-content: start; }
  h2 {
    margin: 0 0 10px;
    font-size: 26px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--green);
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
  }
  h2 em { color: var(--green); font-style: normal; }
  .lead, .card, .node, .row, .prior, .barline {
    border: 1px solid var(--line);
    background: #070a07;
  }
  .front, .section, .stack, .watch, .map, .list, .split, .card, .row, .node, .lead, .head {
    min-width: 0;
    max-width: 100%;
  }
  .head { flex-wrap: wrap; }
  h1, h2, h3, p, a, time, .src { overflow-wrap: anywhere; }
  .lead, .card { padding: 12px; }
  .lead h3, .card h3 { margin: 6px 0; font-size: 20px; line-height: 1.25; font-weight: 400; }
  .card h3 { font-size: 16px; }
  .meta, .guest, time, .src { color: var(--dim); font-size: 12px; letter-spacing: 0.06em; }
  .head { display: flex; justify-content: space-between; gap: 8px; }
  .guest { color: var(--green); margin-bottom: 6px; }
  .card p, .lead p, .row p {
    margin: 6px 0;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .open { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
  .stack, .watch, .map, .list { display: grid; gap: 10px; }
  .watch { display: block; }
  .map { grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); }
  .section { margin-top: 8px; }
  .section.shut .section-body { display: none; }
  .section-head { align-items: baseline; margin: 0; }
  .section-head .sec-title { color: var(--green); font-family: "VT323", ui-monospace, monospace; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .section-head .sec-sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-head .pm { color: var(--green); }
  .order-line, .watch-line { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; border-bottom: 1px dotted var(--line); padding: 6px 0; }
  .order-line h3, .watch-line h3 { margin: 0; font-size: 14px; font-weight: 400; }
  .order-line .so, .watch-line .so { grid-column: 1 / -1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .read { margin: 6px 0 0; padding-left: 18px; }
  .read li { margin: 8px 0; color: var(--bright); }
  .stat { display: flex; justify-content: space-between; gap: 12px; width: 100%; background: transparent; border: 0; border-bottom: 1px dotted var(--line); padding: 7px 0; text-align: left; cursor: pointer; }
  .stat.on { outline: 1px solid var(--green); }
  .break { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .status-list { margin: 8px 0 4px; }
  .fold-btn, .more, .legend-btn { width: 100%; display: flex; justify-content: space-between; gap: 8px; background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 8px; margin: 6px 0; text-align: left; }
  .fold-btn span, .sev { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .fold-body { margin: 0 0 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--dim); font-size: 12px; margin: 8px 0; }
  .legend i { margin-right: 4px; }
  .led.off { background: transparent; box-shadow: none; border: 1px solid var(--dim); }
  #tip { position: fixed; z-index: 60; max-width: 240px; background: #000; color: var(--bright); border: 1px solid var(--green); padding: 6px 8px; font-size: 12px; pointer-events: none; display: none; }
  #tip a { pointer-events: auto; }
  .stat b { color: var(--green); }
  .stat b.off { background: var(--green); color: #000; padding: 0 4px; }
  .sev { display: inline-block; padding: 0 6px; letter-spacing: 0.12em; font-size: 12px; }
  .sev-standby { color: var(--dim); border: 1px solid var(--dim); }
  .sev-alert { color: var(--bright); border: 1px solid var(--green); }
  .sev-action { background: var(--green); color: #000; }
  .sev-critical { background: var(--green); color: #000; animation: blink 1.1s steps(1) infinite; }
  .priors { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .priors li { padding: 8px; border-left: 2px solid var(--green); color: var(--ink); }
  .priors strong { color: var(--green); font-weight: 400; }
  .node { display: block; padding: 10px; text-decoration: none; color: inherit; min-height: 92px; }
  .node:hover { border-color: var(--green); }
  .node b { display: block; color: var(--green); letter-spacing: 0.08em; }
  .led { display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--dim); box-shadow: 0 0 6px var(--dim); }
  .led.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .led.stale { background: var(--dim); box-shadow: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chips button, .tabs button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 5px 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .chips button.on, .tabs button.on { border-color: var(--green); color: var(--green); }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .row { padding: 8px 10px; }
  .row h3 { margin: 2px 0; font-size: 15px; font-weight: 400; }
  .empty { color: var(--dim); border: 1px dashed var(--line); padding: 12px; }
  .bars { display: grid; gap: 6px; }
  .barline { display: grid; grid-template-columns: 52px 1fr 36px; gap: 8px; align-items: center; padding: 4px 8px; }
  .bar { height: 8px; background: #102013; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .ranges { margin-top: 12px; grid-column: 1 / -1; }
  .group { margin: 14px 0 6px; color: var(--bright); font-family: "VT323", ui-monospace, monospace; font-size: 22px; letter-spacing: 0.06em; }
  .venue { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-bottom: 1px dotted var(--line); padding: 6px 0; }
  .open { letter-spacing: 0.14em; }
  .pill-open { background: var(--green); color: #000; padding: 0 6px; }
  .pill-closed { border: 1px solid var(--dim); color: var(--dim); padding: 0 6px; }
  .plot { width: 100%; height: auto; background: #000; border: 1px solid var(--line); }
  .plot .land { fill: #06210c; stroke: var(--dim); stroke-width: 0.6; }
  .assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(160px, 100%), 1fr)); gap: 8px; }
  .spark { width: 100%; height: 36px; }
  .note-plain { color: var(--dim); font-size: 12px; }
  .markets, .threats, .labs { display: grid; gap: 10px; }
  @media (min-width: 801px) {
    .markets { grid-template-columns: 1fr 1fr; }
  }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .foot { margin-top: 28px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .err { color: var(--green); font-size: 12px; }
  .brief { border: 1px solid var(--line); padding: 12px 14px; margin: 0 0 8px; color: var(--bright); line-height: 1.45; }
  .so { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .arrow { color: var(--green); letter-spacing: 0.04em; }
  @media (max-width: 800px) {
    .front, .split, .mast { grid-template-columns: 1fr; }
    .tools { justify-content: flex-start; flex-wrap: wrap; }
    .paper { margin: 8px; overflow-x: clip; }
    .wordmark { letter-spacing: 0.03em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor, .sev-critical { animation: none; }
  }
</style>
</head>
<body>
<div class="paper" id="app">
  <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>
  <header class="mast">
    <div>
      <p class="kicker">prepared citizen desk // public copy</p>
      <h1 class="wordmark">NEWS DESK<span class="cursor" aria-hidden="true"></span></h1>
      <p class="sub">Chicago time · situation log · direct messages never collected</p>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="search the desk" aria-label="Search the desk" />
      <a class="refresh" href="https://github.com/torelldan/news-desk/actions/workflows/refresh.yml">Refresh</a>
    </div>
    <p class="checked" id="checked"></p>
    <div class="chips ranges" id="ranges">
      <button type="button" data-range="all" class="on">All</button>
      <button type="button" data-range="24h">24h</button>
      <button type="button" data-range="48h">48h</button>
      <button type="button" data-range="72h">72h</button>
      <button type="button" data-range="4d">4+ days</button>
    </div>
  </header>
  <p class="banner" id="xbanner" hidden>X feed offline</p>
  <div class="front">
    <section class="section shut" data-sec="today">
      <button type="button" class="fold-btn section-head" data-fold="sec-today" aria-expanded="false"><span class="sec-title">02 // Today</span><span class="sec-sum" id="sum-today"></span><span class="pm">+</span></button>
      <div class="section-body" id="today"></div>
    </section>
    <div class="side">
      <section class="section shut" data-sec="brief">
        <button type="button" class="fold-btn section-head" data-fold="sec-brief" aria-expanded="false"><span class="sec-title">Morning brief</span><span class="sec-sum" id="sum-brief"></span><span class="pm">+</span></button>
        <div class="section-body" id="brief"></div>
      </section>
      <section class="section shut" data-sec="orders">
        <button type="button" class="fold-btn section-head" data-fold="sec-orders" aria-expanded="false"><span class="sec-title">Standing orders</span><span class="sec-sum" id="sum-orders"></span><span class="pm">+</span></button>
        <div class="section-body">
          <div id="status"></div>
          <div id="orders"></div>
        </div>
      </section>
    </div>

  <section class="section shut" data-sec="econ">

    <div class="section-body">
      <p class="note-plain" id="holiday-note"></p>
      <div class="markets" id="markets"></div>
    </div>
  </section>
  <section class="section shut" data-sec="triggers">
    <button type="button" class="fold-btn section-head" data-fold="sec-triggers" aria-expanded="false"><span class="sec-title">Preparedness triggers</span><span class="sec-sum" id="sum-triggers"></span><span class="pm">+</span></button>

  <section class="section shut" data-sec="local">

    <div class="section-body" id="local"></div>
  </section>
  <section class="section shut" data-sec="watch">
    <button type="button" class="fold-btn section-head" data-fold="sec-watch" aria-expanded="false"><span class="sec-title">03 // Watchlist</span><span class="sec-sum" id="sum-watch"></span><span class="pm">+</span></button>
    <div class="section-body watch" id="watch"></div>
  </section>
  <section class="section shut" data-sec="changed">
    <button type="button" class="fold-btn section-head" data-fold="sec-changed" aria-expanded="false"><span class="sec-title">04 // What changed</span><span class="sec-sum" id="sum-changed"></span><span class="pm">+</span></button>
    <div class="section-body" id="changed"></div>
  </section>
  <section class="section shut" data-sec="threats">
    <button type="button" class="fold-btn section-head" data-fold="sec-threats" aria-expanded="false"><span class="sec-title">05 // World threat board</span><span class="sec-sum" id="sum-threats"></span><span class="pm">+</span></button>
    <div class="section-body threats" id="threats"></div>
  </section>
  <section class="section shut" data-sec="impact">
    <button type="button" class="fold-btn section-head" data-fold="sec-impact" aria-expanded="false"><span class="sec-title">06 // Impact map</span><span class="sec-sum" id="sum-impact"></span><span class="pm">+</span></button>
    <div class="section-body">
      <div id="market-read"></div>
      <div id="insights"></div>
      <div id="impact"></div>
      <div class="assets" id="assets"></div>
      <div id="correlations"></div>
      <div id="timeline"></div>
    </div>
  </section>
  <section class="section shut" data-sec="labs">
    <button type="button" class="fold-btn section-head" data-fold="sec-labs" aria-expanded="false"><span class="sec-title">07 // Frontier lab</span><span class="sec-sum" id="sum-labs"></span><span class="pm">+</span></button>
    <div class="section-body">
      <div class="chips" id="fields"></div>
      <div class="labs" id="labs"></div>
    </div>
  </section>
  <section class="section shut" data-sec="map">
    <button type="button" class="fold-btn section-head" data-fold="sec-map" aria-expanded="false"><span class="sec-title">08 // World desk</span><span class="sec-sum" id="sum-map"></span><span class="pm">+</span></button>
    <div class="section-body">
      <div class="map" id="map"></div>
      <div class="list" id="pages" style="margin-top:10px"></div>
    </div>
  </section>
  <section class="section shut" data-sec="radar">
    <button type="button" class="fold-btn section-head" data-fold="sec-radar" aria-expanded="false"><span class="sec-title">Narrative radar</span><span class="sec-sum" id="sum-radar"></span><span class="pm">+</span></button>
    <div class="section-body" id="radar"></div>
  </section>
  <section class="section shut" data-sec="look">
    <button type="button" class="fold-btn section-head" data-fold="sec-look" aria-expanded="false"><span class="sec-title">Weekly look-back</span><span class="sec-sum" id="sum-look"></span><span class="pm">+</span></button>
    <div class="section-body" id="lookback"></div>
  </section>
  <section class="section shut" data-sec="briefs">
    <button type="button" class="fold-btn section-head" data-fold="sec-briefs" aria-expanded="false"><span class="sec-title">09 // Intel briefs</span><span class="sec-sum" id="sum-briefs"></span><span class="pm">+</span></button>
    <div class="section-body">
      <div class="chips" id="chips"></div>
      <div class="list" id="casebook"></div>
    </div>
  </section>
  <section class="section shut" data-sec="log">
    <button type="button" class="fold-btn section-head" data-fold="sec-log" aria-expanded="false"><span class="sec-title">Situation log</span><span class="sec-sum" id="sum-log"></span><span class="pm">+</span></button>
    <div class="section-body">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="ledger" class="on">Situation Log</button>
        <button type="button" role="tab" data-tab="patterns">Signals</button>
        <button type="button" role="tab" data-tab="archive">Cache</button>
      </div>
      <div id="panel"></div>
    </div>
  </section>
  <p class="foot" id="foot"></p>
  <p class="err" id="errs"></p>
</div>

ortunity and challenge has led to giant leaps during her time at NASA. Now as the NASA lander integration lead for Blue Origin’s Blue Moon Mark 2 lander, one of the commercially provided human landing systems for NASA’s Artemis program, Spicer will have her handprint on history.", "url": "https://www.nasa.gov/missions/artemis/i-am-artemis-katie-spicer/", "published": "2026-11-12T14:10:02-06:00", "date": "2026-11-12", "label": "Nov 12, 2026 2:10 PM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "propulsion", "news"], "field": "propulsion", "review": "NEWS", "severity": ""}, {"id": "paper:e8888e86ed6d7893", "kind": "paper", "lane": "science", "source": "Phys.org physics", "sourceId": "paper", "title": "Imperfections reveal unexpected links between light and atomic vibrations in ultrathin boron nitride", "guest": "", "note": "First, one person stands up, followed by their neighbors, one after another, until a wave sweeps through the stadium. Atoms within a material move in a similar way: rather than remaining completely still in their positions, they vibrate together around their respective positions.", "url": "https://phys.org/news/2026-11-imperfections-reveal-unexpected-links-atomic.html", "published": "2026-11-12T13:40:16-06:00", "date": "2026-11-12", "label": "Nov 12, 2026 1:40 PM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "physics", "news"], "field": "physics", "review": "NEWS", "severity": ""}, {"id": "paper:0819957ba899e761", "kind": "paper", "lane": "science", "source": "Phys.org physics", "sourceId": "paper", "title": "Zn doping reveals robust two-gap superconductivity in FeSe", "guest": "", "note": "Researchers using the Steady High Magnetic Field Facility have found that zinc doping unexpectedly alters the superconducting properties of iron selenide (FeSe) while preserving its two-gap superconducting state.", "url": "https://phys.org/news/2026-11-zn-doping-reveals-robust-gap.html", "published": "2026-11-12T13:30:01-06:00", " , and intuitive responses.", "url": "https://blog.google/products-and-platforms/products/search/gemini-4-hydrogen-search-upgrade/", "published": "2026-11-12T12:00:00-06:00", "date": "2026-11-12", "label": "Nov 12, 2026 12:00 PM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "ai", "news"], "field": "ai", "review": "NEWS", "severity": ""}, {"id": "paper:9e3ae86666ba2031", "kind": "paper", "lane": "science", "source": "NASA", "sourceId": "paper", "title": "NASA Ames Stars of the Month: November 2026", "guest": "", "note": "The NASA Ames Science Directorate recognizes the outstanding contributions of (pictured left to right) Alyssa Villanueva, Steve Howell, and Samuel LeBlanc. Their commitment to the NASA mission represents the entrepreneurial spirit, technical expertise, and collaborative disposition needed to explore this world and beyond.", "url": "https://www.nasa.gov/general/nasa-ames-stars-of-the-month-november-2026/", "published": "2026-11-12T11:54:32-06:00", "date": "2026-11-12", "label": "Nov 12, 2026 11:54 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "propulsion", "news"], "field": "propulsion", "review": "NEWS", "severity": ""}, {"id": "paper:f73cdfadfe1d78c3", "kind": "paper", "lane": "science", "source": "Phys.org physics", "sourceId": "paper", "title": "Unified framework establishes rules for classifying unconventional magnets", "guest": "", "note": "Researchers from the Hefei Institutes of Physical Science (HFIPS) of the Chinese Academy of Sciences (CAS) have developed a unified framework for establishing symmetry criteria and classifying unconventional magnets.", "url": "https://phys.org/news/2026-11-framework-unconventional-magnets.html", "published": "2026-11-12T10:00:49-06:00", "date": "2026-11-12", "label": "Nov 12, 2026 10:00 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "physics", "news"], "field": "physics", "review": "NEWS", "severity": ""}, {"id": "paper:a9fcc19d3d88dde0", "kind": "paper", "lane": "science", "source": "NASA", "sourceId": "paper", "title": "NASA’s Hubble Offers Cosmic Sampler of Targets for Roman", "guest": "", "note": "A gallery of gravitational lenses captured by NASA’s Hubble Space Telescope showcases the diversity of this cosmic phenomenon and lays the groundwork for follow-up observations by the Nancy Grace Roman Space Telescope.", "url": "https://science.nasa.gov/missions/hubble/nasas-hubble-offers-cosmic-sampler-of-targets-for-roman/", "published": "2026-11-12T07:18:40-06:00", "date": "2026-11-12", "label": "Nov 12, 2026 7:18 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "propulsion", "news"], "field": "propulsion", "review": "NEWS", "severity": ""}, {"id": "paper:8fb662fa77ac1ffa", "kind": "paper", "lane": "science", "source": "MIT Technology Review", "sourceId": "paper", "title": "The Download: COP31’s climate challenge and the quest for immortality", "guest": "", "note": "What to know about this year’s UN climate talks Thousands of delegates, lobbyists, and journalists have gathered in Antalya, Turkey, for COP31, the annual UN climate talks.", "url": "https://www.technologyreview.com/2026/11/12/1148444/the-download-cop31-climate-talks-cognitive-immortality/", "published": "2026-11-12T07:10:00-06:00", "date": "2026-11-12", "label": "Nov 12, 2026 7:10 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:71d8a78a6c1e0810", "kind": "paper", "lane": "science", "source": "ScienceDaily health", "sourceId": "paper", "title": "Common forever chemicals linked to nearly double the rate of aggressive breast cancer", "guest": "", "note": "An NIH study found that women with high levels of two common “forever chemicals” had up to 93% higher rates of an aggressive form of breast cancer. The discovery raises concerns about the potential health effects of persistent chemicals found in everyday products.", "url": "https://www.sciencedaily.com/releases/2026/11/261112025527.htm", "published": "2026-11-12T03:34:53-06:00", "date": "2026-11-12", "label": "Nov 12, 2026 3:34 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "biomedical", "news"], "field": "biomedical", "review": "NEWS", "severity": ""}, {"id": "paper:edcb44141643d0c8", "kind": "paper", "lane": "science", "source": "ScienceDaily health", "sourceId": "paper", "title": "Scientists discover a common sugar may help cancer cells break free and spread", "guest": "", "note": "Scientists have uncovered a surprising way that fructose, a sugar commonly found in sweetened foods and drinks, may help aggressive ovarian cancer spread. Researchers discovered that cancer cells surviving chemotherapy release fructose that weakens the bonds holding neighboring tumor cells together, making it easier for cancer to spread.", "url": "https://www.sciencedaily.com/releases/2026/11/261111221501.htm", "published": "2026-11-11T22:39:31-06:00", "date": "2026-11-11", "label": "Nov 11, 2026 10:39 PM CT", "weekday": "Wed", "timeKnown": true, "tags": ["science", "biomedical", "news"], "field": "biomedical", "review": "NEWS", "severity": ""}, {"id": "paper:49e4dd60f4a92563", "kind": "paper", "lane": "science", "source": "ScienceDaily health", "sourceId": "paper", "title": "Walking and weight training may not be enough to keep your bones strong", "guest": "", "note": "A surprising new study suggests that walking, jogging, and even traditional weight training may be less effective at stimulating bone formation than high-intensity sports involving explosive movements and sudden changes in direction. Researchers found that activities such as football and handball increased markers of bone formation by up to 46%, potentially revealing a better way to protect bones against aging and osteoporosis.", "url": "https://www.sciencedaily.com/releases/2026/11/261110042601.htm", "published": "2026-11-11T18:10:23-06:00", "date": "2026-11-11", "label": "Nov 11, 2026 6:10 PM CT", "weekday": "Wed", "timeKnown": true, "tags": ["science", "biomedical", "news"], "field": "biomedical", "review": "NEWS", "severity": ""}, {"id": "paper:551b2ca27a97f006", "kind": "paper", "lane": "science", "source": "Google AI blog", "sourceId": "paper", "title": "Gemini Decisions API: Fast, calibrated multimodal decisions", "guest": "", "note": "Meet the Gemini Decisions API, powered by our state-of-the-art model Gemini Decision for fast, calibrated multimodal decisions.", "url": "https://blog.google/innovation-and-ai/technology/developers-tools/gemini-decisions-api/", "published": "2026-11-11T12:00:00-06:00", "date": "2026-11-11", "label": "Nov 11, 2026 12:00 PM CT", "weekday": "Wed", "timeKnown": true, "tags": ["science", "ai", "news"], "field": "ai", "review": "NEWS", "severity": ""}, {"id": "paper:17e0ffc2794a0d89", "kind": "paper", "lane": "science", "source": "MIT Technology Review", "sourceId": "paper", "title": "What to know about this year’s UN climate talks", "guest": "", "note": "It’s that time of year again: Thousands of delegates, lobbyists, and journalists are gathered for the annual UN climate talks, taking place this time in Antalya, Turkey. COP31 officially kicked off on November 8, marking the beginning of negotiations on one of the biggest stages of the climate world.", "url": "https://www.technologyreview.com/2026/11/11/1148308/un-climate-talks/", "published": "2026-11-11T11:00:00-06:00", "date": "2026-11-11", "label": "Nov 11, 2026 11:00 AM CT", "weekday": "Wed", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:acc4a711ddbfe123", "kind": "paper", "lane": "science", "source": "Google AI blog", "sourceId": "paper", "title": "Try Tabletop: Customizable, collaborative spaces for groups to plan, play and do more together.", "guest": "", "note": "Tabletop is a new Google Labs experiment for group collaboration. Build interactive itineraries, polls, and brackets with your team.", "url": "https://blog.google/innovation-and-ai/models-and-research/google-labs/tabletop/", "published": "2026-11-11T10:00:00-06:00", "date": "2026-11-11", "label": "Nov 11, 2026 10:00 AM CT", "weekday": "Wed", "timeKnown": true, "tags": ["science", "ai", "news"], "field": "ai", "review": "NEWS", "severity": ""}, {"id": "paper:cb73f4da8a4f08b3", "kind": "paper", "lane": "science", "source": "ScienceDaily health", "sourceId": "paper", "title": "Energy drinks linked to 11 times more reports of cardiac arrest", "guest": "", "note": "A new study found that energy drinks and stimulant supplements were linked to disproportionately frequent reports of serious heart problems, including 11 times more reports of cardiac arrest and 4.5 times more reports of heart attacks. Young adults accounted for nearly half of the cardiovascular reports involving these products, raising concerns about their potential risks despite the study being unable to prove causation.", "url": "https://www.sciencedaily.com/releases/2026/11/261110042543.htm", "published": "2026-11-11T07:10:51-06:00", "date": "2026-11-11", "label": "Nov 11, 2026 7:10 AM CT", "weekday": "Wed", "timeKnown": true, "tags": ["science", "biomedical", "news"], "field": "biomedical", "review": "NEWS", "severity": ""}, {"id": "paper:eee603c91c32d36b", "kind": "paper", "lane": "science", "source": "MIT Technology Review", "sourceId": "paper", "title": "The Download: preserving minds and weighing open AI risks", "guest": "", "note": "Six wild ideas for perpetuating your mind As we age, we forget most of what we’ve experienced, yet there’s still undeniable continuity: At 30, or 50, or 70, you will still…", "url": "https://www.technologyreview.com/2026/11/11/1148424/the-download-preserving-minds-open-ai-risks/", "published": "2026-11-11T07:10:00-06:00", "date": "2026-11-11", "label": "Nov 11, 2026 7:10 AM CT", "weekday": "Wed", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:7a851907803c902c", "kind": "paper", "lane": "science", "source": "IEEE Spectrum", "sourceId": "paper", "title": "The Dynamo-Electric Principle: 160 Years of Powering Industry", "guest": "", "note": "This article is brought to you by Innomotics . In the annals of industrial history, few innovations have demonstrated such remarkable staying power as the dynamo-electric principle.", "url": "https://spectrum.ieee.org/innomotics-electric-motors-drive-systems", "published": "2026-11-11T05:00:02-06:00", "date": "2026-11-11", "label": "Nov 11, 2026 5:00 AM CT", "weekday": "Wed", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:098b78a375118256", "kind": "paper", "lane": "science", "source": "Google AI blog", "sourceId": "paper", "title": "Experience the art and legacy of Dr. Esther Mahlangu", "guest": "", "note": "A new online archive of Esther Mahlangu’s life and art is now on Google Arts & Culture.", "url": "https://blog.google/company-news/outreach-and-initiatives/arts-culture/esther-mahlangu/", "published": "2026-11-11T03:00:00-06:00", "date": "2026-11-11", "label": "Nov 11, 2026 3:00 AM CT", "weekday": "Wed", "timeKnown": true, "tags": ["science", "ai", "news"], "field": "ai", "review": "NEWS", "severity": ""}, {"id": "paper:f979530e1122f05f", "kind": "paper", "lane": "science", "source": "IEEE Spectrum", "sourceId": "paper", "title": "Speech Processing Pioneer Bishnu Saroop Atal Dies at 93", "guest": "", "note": "Bishnu Saroop Atal Acoustics and signal processing pioneer Life Fellow, 93; died 19 August Atal was an acoustics and signal processing researcher at Bell Labs in Murray Hill, N. J., and later at AT&T ’s Shannon Laboratory, in Florham Park, N.", "url": "https://spectrum.ieee.org/speech-processing-pioneer-in-memoriam", "published": "2026-11-10T13:00:02-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 1:00 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:0e2f7f4f730b8f45", "kind": "paper", "lane": "science", "source": "arXiv cs.AI", "sourceId": "paper", "title": "Medical Image Segmentation: Foundation Model Adaptation versus Task-Specific Training", "guest": "", "note": "Foundation models pretrained on large natural-image collections are increasingly adapted for medical image segmentation, in the expectation that they will replace models trained for each task. Most comparisons, however, use data from the training distribution and a single task-specific baseline whose configuration is rarely justified, and therefore provide limited evidence of performance at new clinical sites.", "url": "https://arxiv.org/abs/2611.14519v1", "published": "2026-11-10T12:59:54-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:59 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "ai", "preprint"], "field": "ai", "review": "PREPRINT", "severity": ""}, {"id": "paper:52086532bcb9e887", "kind": "paper", "lane": "science", "source": "arXiv cs.AI", "sourceId": "paper", "title": "Toward Foundation Detection Models via Example-Based Grounding in EM-DETR", "guest": "", "note": "DeepLearning (DL)-based Computer-Aided Diagnostic (CAD) systems have shown great promise in supporting clinicians, but their performance heavily depends on the availability of large, well-annotated datasets. In medical lesion detection, the scarcity of comprehensive, stan dardized annotations and the heterogeneity of existing datasets limit the development of robust foundation models.", "url": "https://arxiv.org/abs/2611.14518v1", "published": "2026-11-10T12:59:17-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:59 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "ai", "preprint"], "field": "ai", "review": "PREPRINT", "severity": ""}, {"id": "paper:c97634d807ef713b", "kind": "paper", "lane": "science", "source": "arXiv cs.AI", "sourceId": "paper", "title": "Contrastive Discovery: Open-Ended Scientific Discovery over Competing Explanations", "guest": "", "note": "LLM agents are increasingly used for open-ended, data-driven scientific discovery, yet most of them evaluate hypotheses pointwise, testing an empirical claim $h$ only against its complement $\\neg h$. When evidence rejects $h$, the agent learns that one explanation is unlikely but not which alternative the evidence supports.", "url": "https://arxiv.org/abs/2611.14514v1", "published": "2026-11-10T12:58:43-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:58 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "ai", "preprint"], "field": "ai", "review": "PREPRINT", "severity": ""}, {"id": "paper:3d92572540814271", "kind": "paper", "lane": "science", "source": "arXiv gr-qc / hep-th", "sourceId": "paper", "title": "Solving the SU(2) BFSS model", "guest": "", "note": "We compare ground correlators against islands obtained using the matrix bootstrap and find agreement up to five significant figures. The power law tail of this wavefunction determines the three-point amplitude, which agrees with the computation of Herderschee and Maldacena.", "url": "https://arxiv.org/abs/2611.14512v1", "published": "2026-11-10T12:57:34-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:57 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "physics", "preprint"], "field": "physics", "review": "PREPRINT", "severity": ""}, {"id": "paper:e2c9d2b218ab2b19", "kind": "paper", "lane": "science", "source": "arXiv cs.AI", "sourceId": "paper", "title": "Comparative Analysis of Agent Evaluation Frameworks: Stability, Detection, and Discovery in Enterprise Analytics Agents", "guest": "", "note": "Deploying LLM-based analytics agents in enterprise settings requires evaluation frameworks that can reliably detect failures across complex, multi-tool workflows. We present a three-phase comparative study of three evaluation frameworks, each representing a distinct evaluation paradigm (trace-based LLM judging, text-only LLM judging with red-teaming, and deterministic heuristics), applied to two analytics agents in a controlled research setting using frozen execution traces.", "url": "https://arxiv.org/abs/2611.14493v1", "published": "2026-11-10T12:50:06-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:50 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "ai", "preprint"], "field": "ai", "review": "PREPRINT", "severity": ""}, {"id": "paper:b387701a47a88550", "kind": "paper", "lane": "science", "source": "arXiv quant-ph", "sourceId": "paper", "title": "Nonperturbative string dynamics in a (2+1)D lattice gauge theory on a superconducting quantum processor", "guest": "", "note": "Electric flux strings underpin confinement in gauge theories. In two spatial dimensions, their evolution involves competing processes of charge motion, pair creation, and transverse deformation.", "url": "https://arxiv.org/abs/2611.14484v1", "published": "2026-11-10T12:45:36-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:45 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "quantum", "preprint"], "field": "quantum", "review": "PREPRINT", "severity": ""}, {"id": "paper:c8143d97ade3b863", "kind": "paper", "lane": "science", "source": "arXiv gr-qc / hep-th", "sourceId": "paper", "title": "Singustars: Between Black Holes and Compact Stars", "guest": "", "note": "The Tolman--Oppenheimer--Volkoff equations admit singular solutions in which a negative point mass is surrounded by a self-gravitating fluid. For a $Γ$-law polytropic equation of state, these solutions, which we call singustars, are thick shells bounded by two zero-pressure surfaces around a naked, repulsive, negative-mass singularity, with a Schwarzschild exterior.", "url": "https://arxiv.org/abs/2611.14482v1", "published": "2026-11-10T12:45:02-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:45 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "physics", "preprint"], "field": "physics", "review": "PREPRINT", "severity": ""}, {"id": "paper:00ea04bd93406b56", "kind": "paper", "lane": "science", "source": "arXiv quant-ph", "sourceId": "paper", "title": "Finite-Key Readiness and Authentication-Key Replenishment in QKD-Assisted UAV Edge Computing", "guest": "", "note": "A service that needs fresh quantum keys must wait for key release, and may be denied it, before protected computation starts. We quantify this cost for a trusted stationary UAV serving two ground gateways, each obtaining its keys from one finite-key decoy-state BB84 attempt with parameters fixed in advance.", "url": "https://arxiv.org/abs/2611.14461v1", "published": "2026-11-10T12:29:12-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:29 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "quantum", "preprint"], "field": "quantum", "review": "PREPRINT", "severity": ""}, {"id": "paper:04cd12faf3fca933", "kind": "paper", "lane": "science", "source": "arXiv quant-ph", "sourceId": "paper", "title": "Structure of correlations for the single-$j$ model using quantum information theory", "guest": "", "note": "We say that a system undergoes a quantum phase transition when the mean-field ground state of a given Hamiltonian spontaneously breaks its symmetries depending on the Hamiltonian parameters. It is a widely accepted view that this phenomenon enables the mean-field state to absorb the maximum amount of correlations without losing its mean-field structure.", "url": "https://arxiv.org/abs/2611.14460v1", "published": "2026-11-10T12:28:52-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:28 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "quantum", "preprint"], "field": "quantum", "review": "PREPRINT", "severity": ""}, {"id": "paper:8f8f3494423ab89b", "kind": "paper", "lane": "science", "source": "arXiv quant-ph", "sourceId": "paper", "title": "Quantum Thermal Transistor via Nonlinear Environmental Coupling", "guest": "", "note": "Thermal amplification enables sensitive control of heat currents, providing a basis for heat management and thermal signal processing in quantum devices. For a harmonic oscillator coupled to emitter, collector, and base thermal reservoirs, we recover the absence of thermal amplification when system-reservoir interactions permit only single-quantum exchange.", "url": "https://arxiv.org/abs/2611.14458v1", "published": "2026-11-10T12:26:46-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:26 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "quantum", "preprint"], "field": "quantum", "review": "PREPRINT", "severity": ""}, {"id": "paper:18457e2be80cbb55", "kind": "paper", "lane": "science", "source": "arXiv gr-qc / hep-th", "sourceId": "paper", "title": "Gravitational radiation from a particle in circular orbit around a wormhole: the nonrotating case", "guest": "", "note": "calculation for the case of gravitational radiation from a particle in a circular orbit around a black hole to the case of the wormhole. Considering the motion of a test particle around a Schwarzschild like wormhole and using Teukolsky formalism, we have obtained an analytical result of flux at infinity under the assumption of small velocities.", "url": "https://arxiv.org/abs/2611.14455v1", "published": "2026-11-10T12:23:12-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:23 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "physics", "preprint"], "field": "physics", "review": "PREPRINT", "severity": ""}, {"id": "paper:18457e2be80cbb55", "kind": "paper", "lane": "science", "source": "arXiv physics.space-ph", "sourceId": "paper", "title": "Gravitational radiation from a particle in circular orbit around a wormhole: the nonrotating case", "guest": "", "note": "calculation for the case of gravitational radiation from a particle in a circular orbit around a black hole to the case of the wormhole. Considering the motion of a test particle around a Schwarzschild like wormhole and using Teukolsky formalism, we have obtained an analytical result of flux at infinity under the assumption of small velocities.", "url": "https://arxiv.org/abs/2611.14455v1", "published": "2026-11-10T12:23:12-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:23 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "propulsion", "preprint"], "field": "propulsion", "review": "PREPRINT", "severity": ""}, {"id": "paper:8aa7388824c1656e", "kind": "paper", "lane": "science", "source": "arXiv physics.space-ph", "sourceId": "paper", "title": "Nucleation of water ice under weak ionization via clustering on negative ions", "guest": "", "note": "Water-ice grains are shown to form spontaneously in a cold, weakly-ionized laboratory plasma with trace water admixture when neutrals and ions are cooled below $\\sim$200 K. These conditions serve as an analog of ice nucleation in cold astrophysical and atmospheric environments.", "url": "https://arxiv.org/abs/2611.14441v1", "published": "2026-11-10T12:11:44-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 12:11 PM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "propulsion", "preprint"], "field": "propulsion", "review": "PREPRINT", "severity": ""}, {"id": "paper:1beed449ed23ef11", "kind": "paper", "lane": "science", "source": "arXiv gr-qc / hep-th", "sourceId": "paper", "title": "The Higgs boson, naturalness, and the Universe", "guest": "", "note": "The Higgs boson -- the only known fundamental scalar particle -- may have profound implications for both particle physics and cosmology. This review examines how the Higgs field may have influenced the Universe from its earliest moments to its present state.", "url": "https://arxiv.org/abs/2611.14370v1", "published": "2026-11-10T11:26:05-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 11:26 AM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "physics", "preprint"], "field": "physics", "review": "PREPRINT", "severity": ""}, {"id": "paper:f10905d232a6f197", "kind": "paper", "lane": "science", "source": "arXiv physics.space-ph", "sourceId": "paper", "title": "Constraining electron heat flux from reduced measurements", "guest": "", "note": "Coronal heating estimates depend partly on electron heat transport. Different electron velocity distributions can match the same observations yet carry different heat fluxes.", "url": "https://arxiv.org/abs/2611.14340v1", "published": "2026-11-10T11:04:48-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 11:04 AM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "propulsion", "preprint"], "field": "propulsion", "review": "PREPRINT", "severity": ""}, {"id": "paper:ba039fce49c48aa3", "kind": "paper", "lane": "science", "source": "IEEE Spectrum", "sourceId": "paper", "title": "Catch Electronics Shock and Drop Failures Before Hardware Is Built", "guest": "", "note": "Learn how guided virtual shock and drop analysis helps engineering teams identify reliability risks before physical testing, reduce qualification iterations, optimize packaging designs, and accelerate electronics product development. What you will learn about: Why shock failures found during physical qualification are costly, and how coupled electrical, mechanical, thermal, and packaging effects make them hard to predict.", "url": "https://content.knowledgehub.wiley.com/shifting-reliability-left-guided-virtual-validation-for-electronics-shock-and-drop-testing/", "published": "2026-11-10T05:00:02-06:00", "date": "2026-11-10", "label": "Nov 10, 2026 5:00 AM CT", "weekday": "Tue", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:5f7ce8145961a85d", "kind": "paper", "lane": "science", "source": "arXiv physics.space-ph", "sourceId": "paper", "title": "Electric Propulsion Database Development and Integrated Modelling Analysis", "guest": "", "note": "Electric propulsion (EP) systems require significant subsystem integration and data driven mod- elling for accurate sizing. This paper is an overview of a high-fidelity database development and analysis aiming to fill the gap in electric propulsion sizing.", "url": "https://arxiv.org/abs/2611.13121v1", "published": "2026-11-09T13:10:01-06:00", "date": "2026-11-09", "label": "Nov 9, 2026 1:10 PM CT", "weekday": "Mon", "timeKnown": true, "tags": ["science", "propulsion", "preprint"], "field": "propulsion", "review": "PREPRINT", "severity": ""}, {"id": "paper:d59ea2e2a5a2c2a0", "kind": "paper", "lane": "science", "source": "IEEE Spectrum", "sourceId": "paper", "title": "AI Agents Are Testing the Limits of Zero-Trust Security", "guest": "", "note": "This article is brought to you by Queen’s University Belfast . Several teams around the globe are leveraging AI by creating a task force of agents managed by an orchestrator and creating applications to support risk assessment, client profiling, match making, and information yield with a slight overview of decision making.", "url": "https://spectrum.ieee.org/zero-trust-agentic-ai-architecture", "published": "2026-11-09T10:25:06-06:00", "date": "2026-11-09", "label": "Nov 9, 2026 10:25 AM CT", "weekday": "Mon", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:9a2a912ca24e2f0c", "kind": "paper", "lane": "science", "source": "bioRxiv", "sourceId": "paper", "title": "A subtype-specific gene regulatory program controls differential circuit integration of deep CA3 pyramidal neurons", "guest": "", "note": "How closely related neuronal subtypes integrate into different circuits remains poorly understood. Deep and superficial hippocampal CA3 pyramidal neurons (PNs) differ in intrinsic firing and mossy fiber (MF) input at specialized postsynaptic structures termed thorny excrescences (TEs). Combining developmental single-nucleus multiomics with genetic targeting, morphological analysis and electrophysiology, we identify the transcription factor ST18 as a regulator of deep CA3 subtype identity. ST18 m", "url": "https://www.biorxiv.org/content/10.64898/2026.11.03.763963", "published": "2026-11-06T18:00:00-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 6:00 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:4c6cbccb84e647fd", "kind": "paper", "lane": "science", "source": "bioRxiv", "sourceId": "paper", "title": "Learning to play with spikes: characterizing, predicting, and engineering unsupervised plasticity rules for spiking reservoir computing", "guest": "", "note": "Spiking reservoir computing, and reservoir computing more generally, is a powerful and efficient framework for neuromorphic and biological applications, in which a fixed random reservoir drives a trained readout. Its performance depends critically on the reservoir initialization, so that enriching the reservoir with adaptive, unsupervised plasticity rules offers a natural solution to this limitation. However, it is unclear which rules work, or why, and how to find the best-suited rules for speci", "url": "https://www.biorxiv.org/content/10.64898/2026.09.15.751573", "published": "2026-11-06T18:00:00-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 6:00 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:3062135ace505ed1", "kind": "paper", "lane": "science", "source": "bioRxiv", "sourceId": "paper", "title": "FMRP safeguards long mRNA expression by opposing repressive RNP states", "guest": "", "note": "Fragile X messenger ribonucleoprotein (FMRP) is widely viewed as a translational repressor, yet its loss paradoxically compromises expression of exceptionally long, dosage-sensitive neurodevelopmental mRNAs. First shown in Drosophila oocytes, this selective loss extends to mouse cortex and hippocampus, but its mechanism remains unknown. Here, we uncover a protective function for FMRP: shielding long mRNAs from repression by Me31B/DDX6, a conserved RNA helicase that organizes repressive RNP compl", "url": "https://www.biorxiv.org/content/10.64898/2026.07.23.739932", "published": "2026-11-06T18:00:00-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 6:00 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:fae78c79c19dec74", "kind": "paper", "lane": "science", "source": "bioRxiv", "sourceId": "paper", "title": "Integrated genomics and transcriptomics reveal molecular insights into extreme dietary adaptation in vampire bats", "guest": "", "note": "Vampire bats are the only tetrapods that feed exclusively on blood. To uncover the molecular changes associated with this extreme dietary specialization, we generated six new reference genomes, including genomes of all three vampire bat species, and integrated comparative analyses of gene sequence evolution (selection signatures, duplications, and losses) with transcriptomic data from six major organs to identify shifts in gene expression. Our integrative analyses reveal sequence or expression c", "url": "https://www.biorxiv.org/content/10.64898/2026.07.24.740446", "published": "2026-11-06T18:00:00-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 6:00 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:98489cfeeb1ac47d", "kind": "paper", "lane": "science", "source": "medRxiv", "sourceId": "paper", "title": "Diagnostic Value in Discarded Reads: Re-evaluating Multi-Mapping cfDNA Fragmentomics and GC Bias in Early-Stage Cancer.", "guest": "", "note": "BackgroundLow-coverage plasma cell-free DNA (cfDNA) sequencing is an inexpensive substrate for cancer detection. Standard pipelines discard fragments with low mapping quality, which originate mostly from repetitive DNA, although pericentromeric satellite repeats are frequently hypomethylated in cancer. We asked whether the fraction of multi-mapping cfDNA fragments differs between early-stage cancer and matched healthy controls, and how it compares with conventional fragmentomic features under st", "url": "https://www.medrxiv.org/content/10.64898/2026.11.05.26367150", "published": "2026-11-06T18:00:00-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 6:00 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:50192049fb3d343e", "kind": "paper", "lane": "science", "source": "medRxiv", "sourceId": "paper", "title": "ShortKit-ML: an open toolkit for measuring shortcut potential in medical imaging embeddings", "guest": "", "note": "Background and Objective: A classifier trained on frozen embeddings can take a shortcut through a sensitive attribute only if the embedding carries information about it beyond what the task label explains: its shortcut potential. We asked whether this can be measured on the embedding alone with a known false positive rate, and whether it predicts how strongly a classifier trained on confounded data relies on the attribute. Methods: ShortKit-ML tests whether an embedding E and a sensitive attribu", "url": "https://www.medrxiv.org/content/10.64898/2026.04.29.26352053", "published": "2026-11-06T18:00:00-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 6:00 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:3f60a3303f9d6c7b", "kind": "paper", "lane": "science", "source": "medRxiv", "sourceId": "paper", "title": "Dense Breast Tissue Segmentation under Limited Annotation: Comparing CNNs, Transformers, Self-Supervision, and Prompting", "guest": "", "note": "Dense breast tissue reduces the sensitivity of mammographic screening and is an important risk factor for breast cancer, making accurate dense-tissue segmentation particularly important when expert pixel-level annotations are limited. We empirically study dense breast tissue segmentation under limited pixel-level supervision using a small expert-annotated dataset (596 images) together with an in-domain unlabeled mammography dataset (20,000 images). We compare classical pixel-level segmentation m", "url": "https://www.medrxiv.org/content/10.64898/2026.02.23.26346855", "published": "2026-11-06T18:00:00-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 6:00 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:ece50f47921a7298", "kind": "paper", "lane": "science", "source": "medRxiv", "sourceId": "paper", "title": "Testing the internal validity of the maintenance/discontinuation study design for antidepressant medications in depression using simulations", "guest": "", "note": "BackgroundEvidence for longer-term antidepressant use in major depressive disorder comes largely from maintenance/discontinuation trials. Among patients who remit on antidepressants, approximately 20% relapse within one year when treatment is maintained, compared with 40% when treatment is discontinued. This apparent benefit exceeds what might be expected from the modest effects observed in acute-phase trials, raising questions about the internal validity of maintenance/discontinuation trials. B", "url": "https://www.medrxiv.org/content/10.1101/2025.10.02.25337182", "published": "2026-11-06T18:00:00-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 6:00 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "biomedical", "preprint"],     const sign = value > 0 ? "+" : "";
    return `${key} ${sign}${value}${unit || "%"}`;
  }).join(" · ");
  const rows = (doc.rows || []).map((row) => `<article class="card"><div class="head"><b>${esc(row.name)}</b><span>${esc(fmtNum(row.level))}</span></div><p class="meta">${esc(changeText(row.changes, row.unit))}</p>${sparkline(row.spark || [])}</article>`).join("");
  const corr = (doc.correlations || []).map((row) => `<p class="meta">${esc(row.metal)} vs ${esc(row.driver)} · 30d ${row.d30 == null ? "n/a" : row.d30} · 90d ${row.d90 == null ? "n/a" : row.d90}</p>`).join("");
  const funds = doc.funds || {};
  const fundsLine = funds.dff == null && !funds.zqf ? "" : `<p class="meta">Fed funds: DFF ${esc(fmtNum(funds.dff))}% · ZQF27 implied ${esc(fmtNum(funds.zqf))}% · ZQH27 implied ${esc(fmtNum(funds.zqh))}%</p>`;
  const curve = (doc.curve || []).map((row) => `<article class="card"><div class="head"><b>${esc(row.name)}</b><span class="sev sev-${row.inverted ? "alert" : "standby"}">${esc(row.flag || "")}</span></div><p class="meta">${esc(fmtNum(row.value))}%</p>${sparkline(row.spark || [])}</article>`).join("");
  const ratio = doc.copperGold ? `<p class="meta">Copper/gold ${esc(fmtCopperGold(doc.copperGold.ratio))} beside 10Y ${esc(fmtNum(doc.copperGold.yield10))}%</p>` : "";
  const volumes = (doc.volumes || []).map((row) => `<p class="meta">${esc(row.name)} volume ${esc(fmtNum(row.volume))} · price ${esc(fmtNum(row.price))}</p>`).join("");
  const oil = doc.oil ? `<p class="meta">Brent ${esc(fmtNum(doc.oil.brent))} · WTI ${esc(fmtNum(doc.oil.wti))} · energy strikes in 7 days: ${esc(String(doc.oil.energyStrikes || 0))}</p>` : "";
  return `<h3 class="group">Gold and silver drivers</h3><div class="split">${rows}</div>${corr}${fundsLine}<h3 class="group">Yield curve</h3><div class="split">${curve}</div>${ratio}${volumes}${oil}`;
}
function renderImpact() {
  const threats = ((DESK.threats || {}).items || []).filter((item) => Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lon))).filter(passes);
  const dots = threats.map((item) => {
    const [x, y] = project(item.lat, item.lon);
    const radius = item.severity === "CRITICAL" ? 8 : item.severity === "ACTION" ? 6 : item.severity === "ALERT" ? 4.5 : 3;
    const url = safeUrl(item.url);
    const title = esc(item.title || "");
    return `<a href="${esc(url)}" target="_blank" rel="noopener"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${radius}" fill="#39ff14"><title>${title}</title></circle></a>`;
  }).join("");
  const path = (DESK.world || {}).path || "";
  document.getElementById("impact").innerHTML = fold("show-map", `Map · ${threats.length} located events`, `<svg class="plot" viewBox="0 0 800 400" role="img" aria-label="World plot of located events"><path class="land" d="${path}"></path>${dots}</svg><p class="note-plain">Marker size follows the status: standby, alert, action, critical.</p>`, false);
  const cards = ((DESK.assets || {}).series || []).map((asset) => {
    const src = safeUrl(asset.source);
    const name = src ? `<a href="${esc(src)}" target="_blank" rel="noopener">${esc(asset.name)}</a>` : esc(asset.name);
    const change = asset.changePct === null || asset.changePct === undefined ? "n/a" : `${asset.changePct > 0 ? "+" : ""}${asset.changePct}%`;
    return `<article class="card" id="asset-${esc(asset.id || "")}"><div class="head"><b>${name}</b><span>${esc(change)}</span></div><div>${esc(fmtNum(asset.level))}</div>${sparkline((asset.points || []).slice(-8))}</article>`;
  }).join("");
  document.getElementById("assets").innerHTML = cards || empty("Quotes did not answer on this check.");
  const explain = ((DESK.impact || {}).explainer || []).map((line) => `<li>${esc(line)}</li>`).join("");
  const zone = (DESK.impact || {}).vixZone ? `<p class="meta">VIX zone: ${esc((DESK.impact || {}).vixZone)}</p>` : "";
  document.getElementById("market-read").innerHTML = marketReadHtml() + (explain ? `<h3 class="group">What's driving gold and silver</h3><ul class="read">${explain}</ul>` : "") + zone + driverDashboard();
  document.getElementById("insights").innerHTML = insightHtml();
  document.getElementById("correlations").innerHTML = fold("show-numbers", "Show the numbers", numberDumpHtml(), false);
  renderTimeline(threats);
}
function renderTimeline(events) {
  const host = document.getElementById("timeline");
  const series = ((DESK.assets || {}).series || []).filter((asset) => (asset.points || []).length >= 2);
  if (!series.length) {
    host.innerHTML = empty("No price history to plot.");
    return;
  }
  const width = 640;
  const height = 180;
  const left = 36;
  const right = 12;
  const top = 16;
  const bottom = 28;
  const legend = series.map((asset) => {
    const off = state.assetsOff.includes(asset.id);
    return `<button type="button" class="legend-btn" data-asset="${esc(asset.id)}" aria-pressed="${off ? "false" : "true"}">${off ? "○" : "●"} ${esc(asset.name)}</button>`;
  }).join("");
  const visible = series.filter((asset) => !state.assetsOff.includes(asset.id));
  const lines = visible.map((asset) => {
    const pts = asset.points.slice(-30);
    const start = Number(pts[0].price) || 1;
    const coords = pts.map((point, i) => {
      const x = left + (i / (pts.length - 1)) * (width - left - right);
      const pct = ((Number(point.price) / start) - 1) * 100;
      const y = 90 - Math.max(-60, Math.min(60, pct * 1.6));
      return { x, y, point, pct, asset };
    });
    const poly = coords.map((dot) => `${dot.x.toFixed(1)},${dot.y.toFixed(1)}`).join(" ");
    const dots = coords.map((dot) => `<circle cx="${dot.x.toFixed(1)}" cy="${dot.y.toFixed(1)}" r="3.2" fill="#39ff14" data-tip="${esc(asset.name)} · ${esc(dot.point.date)} · ${esc(fmtNum(dot.point.price))} (${dot.pct >= 0 ? "+" : ""}${dot.pct.toFixed(1)}% from start)"></circle>`).join("");
    return `<polyline fill="none" stroke="#39ff14" stroke-width="1.4" points="${poly}"></polyline>${dots}`;
  }).join("");
  const newest = Date.now();
  const oldest = newest - 30 * 86400000;
  const marks = events.slice(0, 20).map((item) => {
    const t = Date.parse(item.published || "");
    if (!Number.isFinite(t) || t < oldest || t > newest) return "";
    const x = left + ((t - oldest) / (newest - oldest)) * (width - left - right);
    const url = safeUrl(item.url);
    const tip = esc(item.title || "Event");
    return `<a href="${esc(url)}" target="_blank" rel="noopener" data-tip="${tip}"><line x1="${x.toFixed(1)}" y1="${top}" x2="${x.toFixed(1)}" y2="${height - bottom}" stroke="#1f7a32" stroke-width="6" stroke-opacity="0.35"></line><line x1="${x.toFixed(1)}" y1="${top}" x2="${x.toFixed(1)}" y2="${height - bottom}" stroke="#7dff6b" stroke-width="1"></line></a>`;
  }).join("");
  const firstDate = (visible[0] && visible[0].points.slice(-30)[0].date) || "";
  const lastDate = (visible[0] && visible[0].points.slice(-1)[0].date) || "";
  host.innerHTML = fold("show-lines", "Price lines", `<p class="note-plain">Each line is the move from the first close on the chart. Vertical marks are events. Not a forecast.</p><div class="legend">${legend}</div><svg class="plot" viewBox="0 0 ${width} ${height}" role="img" aria-label="Asset moves versus events"><text x="4" y="96" fill="#1f7a32" font-size="10" transform="rotate(-90 8 96)">% from start</text><text x="${left}" y="${height - 8}" fill="#1f7a32" font-size="10">${esc(firstDate)}</text><text x="${width - 90}" y="${height - 8}" fill="#1f7a32" font-size="10">${esc(lastDate)}</text>${marks}${lines}</svg>`, false);
}
function labCard(item) {
  const review = item.review || "NEWS";
  const klass = review === "PEER-REVIEWED" ? "sev-action" : review === "PREPRINT" ? "sev-alert" : "sev-standby";
  return row(item).replace("<article class=\"row\">", `<article class="row"><span class="sev ${klass}">${esc(review)}</span> `);
}
function renderLabs() {
  const names = { physics: "Physics", propulsion: "Propulsion", biomedical: "Biomedical", quantum: "Quantum", technology: "Technology", ai: "AI" };
  const items = labItems();
  const html = Object.keys(names).map((field) => {
    const mine = items.filter((item) => item.field === field).sort((a, b) => Date.parse(b.published || 0) - Date.parse(a.published || 0));
    const top = mine.slice(0, 3).map((item) => esc(item.title)).join(" · ");
    const body = mine.length ? mine.map(labCard).filter(Boolean).join("") : `<p class="meta">None in this window.</p>`;
    const count = mine.filter((item) => labCard(item)).length;
    return fold("lab-" + field, `${esc(names[field])} · ${count}<span class="meta">${top ? " · " + top : ""}</span>`, body || `<p class="meta">None in this window.</p>`, false);
  }).join("");
  document.getElementById("labs").innerHTML = html || empty("No lab items in that window.");
}
function renderBoards() {
  renderMarkets();
  renderThreats();
  renderImpact();
  renderLabs();
}
function render() {
  claimed = new Set();
  const items = allItems();
  const desk = DESK;
  document.getElementById("checked").textContent = desk.updated
    ? `Sources checked ${desk.updated}. Window ${desk.retainDays || 120} days. Filter applies across the page.`
    : "Run python3 scripts/fetch.py && python3 build.py";
  const banner = document.getElementById("xbanner");
  const offline = !(desk.x && desk.x.online);
  banner.hidden = !offline;
  banner.textContent = offline ? "X feed offline" : "";
  renderStatus(items);
  renderBrief();
  renderToday();
  renderLocal();
  renderTriggers();
  renderOrders();
  renderWatch();
  renderChanged();
  renderBoards();
  renderRadar();
  renderLookback();
  renderMap();
  renderChips(items);
  renderCasebook();
  renderPanel();
  paintSections();
  bindDesk();
  const errs = desk.errors || [];
  document.getElementById("errs").textContent = errs.length ? `Source down: ${errs.join(" · ")}` : "";
  const xReason = (desk.x && desk.x.reason) || "";
  const xLine = offline ? "X feed offline." : "X public posts are on.";
  document.getElementById("foot").textContent =
    `Times are America/Chicago. Notes come from the source. A blank quote means that feed did not answer. This is not a forecast or a trade instruction. ${xLine} Direct messages are never requested.`;
}
function showTip(event) {
  const tip = document.getElementById("tip");
  const text = event.currentTarget.getAttribute("data-tip");
  if (!tip || !text) return;
  tip.textContent = text;
  tip.style.display = "block";
  tip.style.left = Math.min(window.innerWidth - 250, event.clientX + 12) + "px";
  tip.style.top = Math.min(window.innerHeight - 80, event.clientY + 12) + "px";
}
function hideTip() {
  const tip = document.getElementById("tip");
  if (tip) tip.style.display = "none";
}
function bindDesk() {
  document.querySelectorAll("[data-tip]").forEach((node) => {
    if (node.dataset.tipBound) return;
    node.dataset.tipBound = "1";
    node.addEventListener("mouseenter", showTip);
    node.addEventListener("mousemove", showTip);
    node.addEventListener("mouseleave", hideTip);
    node.addEventListener("click", showTip);
  });
}
function boot() {
  if (typeof DESK === "undefined") {
    document.getElementById("app").insertAdjacentHTML("beforeend", "<p class='empty'>This is the template. Run python3 build.py.</p>");
    return;
  }
  try {
    const saved = JSON.parse(localStorage.getItem("desk-ui") || "{}");
    state.open = saved.open || {};
    state.more = saved.more || {};
    state.focus = saved.focus || "";
    state.assetsOff = saved.assetsOff || [];
    if (saved.range) state.range = saved.range;
    if (saved.tab) state.tab = saved.tab;
    if (saved.field) state.field = saved.field;
  } catch (err) { /* ignore stored state */ }
  document.querySelectorAll("#ranges button").forEach((btn) => btn.classList.toggle("on", btn.dataset.range === state.range));
  document.querySelectorAll(".tabs button").forEach((btn) => {
    const on = btn.dataset.tab === state.tab;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.getElementById("app").addEventListener("click", (event) => {
    const fold = event.target.closest("[data-fold]");
    if (fold) {
      state.open[fold.dataset.fold] = fold.getAttribute("aria-expanded") !== "true";
      remember();
      render();
      return;
    }
    const more = event.target.closest("[data-more]");
    if (more) {
      state.more[more.dataset.more] = !state.more[more.dataset.more];
      remember();
      render();
      return;
    }
    const focus = event.target.closest("[data-focus]");
    if (focus) {
      state.focus = state.focus === focus.dataset.focus ? "" : focus.dataset.focus;
      remember();
      render();
      return;
    }
    const asset = event.target.closest("[data-asset]");
    if (asset) {
      const id = asset.dataset.asset;
      state.assetsOff = state.assetsOff.includes(id) ? state.assetsOff.filter((item) => item !== id) : state.assetsOff.concat(id);
      remember();
      render();
    }
  });
  document.getElementById("q").addEventListener("input", (event) => {
    state.q = event.target.value.trim().toLowerCase();
    render();
  });
  document.querySelectorAll("#ranges button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.range = btn.dataset.range || "all";
      document.querySelectorAll("#ranges button").forEach((el) => el.classList.toggle("on", el === btn));
      render();
    });
  });
  document.querySelectorAll(".tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      document.querySelectorAll(".tabs button").forEach((el) => {
        el.classList.toggle("on", el === btn);
        el.setAttribute("aria-selected", el === btn ? "true" : "false");
      });
      render();
    });
  });
  render();
}
boot();
</script>
