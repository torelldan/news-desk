<style>
  :root {
    --bg: #000000;
    --ink: #7dff6b;
    --bright: #d6ffc8;
    --dim: #1f7a32;
    --green: #39ff14;
    --line: #14521f;
    --panel: rgba(0, 0, 0, 0.94);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    min-height: 100%;
    background: #000;
  }
  body::before {
    content: "";
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 40;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.16) 0px,
      rgba(0, 0, 0, 0.16) 1px,
      transparent 2px,
      transparent 4px
    );
    opacity: 0.28;
  }
  a { color: var(--green); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { color: var(--bright); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .paper {
    position: relative;
    z-index: 1;
    max-width: 1120px;
    margin: 22px auto 48px;
    padding: 22px 18px 36px;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .tick { position: absolute; width: 12px; height: 12px; border: 2px solid var(--green); }
  .tick.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .tick.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .tick.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .tick.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .mast {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 18px;
    align-items: end;
    border-top: 3px solid var(--green);
    border-bottom: 3px solid var(--green);
    padding: 12px 0 14px;
  }
  .kicker {
    margin: 0;
    color: var(--bright);
    letter-spacing: 0.22em;
    font-size: 12px;
  }
  h1, h2, .kicker, .wordmark { font-family: "VT323", ui-monospace, monospace; }
  .wordmark {
    margin: 0;
    font-size: clamp(42px, 8vw, 84px);
    line-height: 0.85;
    letter-spacing: 0.04em;
    color: var(--green);
    position: relative;
  }
  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 0.85em;
    margin-left: 4px;
    background: var(--green);
    vertical-align: baseline;
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  .sub { margin: 6px 0 0; color: var(--dim); letter-spacing: 0.12em; font-size: 12px; text-transform: uppercase; }
  .tools { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  .tools input {
    background: #070907;
    border: 1px solid var(--line);
    padding: 8px 10px;
    min-width: min(320px, 70vw);
  }
  a.refresh {
    display: inline-block;
    border: 1px solid var(--green);
    color: var(--bright);
    text-decoration: none;
    padding: 8px 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  a.refresh:hover { background: var(--green); color: #000; }
  .checked { grid-column: 1 / -1; color: var(--dim); font-size: 13px; }
  .banner {
    margin: 12px 0 0;
    border: 1px solid var(--green);
    color: var(--bright);
    padding: 8px 10px;
    letter-spacing: 0.08em;
  }
  .front {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px;
    margin-top: 8px;
    align-items: start;
  }
  .side { display: grid; gap: 8px; align-content: start; }
  h2 {
    margin: 0 0 10px;
    font-size: 26px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--green);
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
  }
  h2 em { color: var(--green); font-style: normal; }
  .lead, .card, .node, .row, .prior, .barline {
    border: 1px solid var(--line);
    background: #070a07;
  }
  .front, .section, .stack, .watch, .map, .list, .split, .card, .row, .node, .lead, .head {
    min-width: 0;
    max-width: 100%;
  }
  .head { flex-wrap: wrap; }
  h1, h2, h3, p, a, time, .src { overflow-wrap: anywhere; }
  .lead, .card { padding: 12px; }
  .lead h3, .card h3 { margin: 6px 0; font-size: 20px; line-height: 1.25; font-weight: 400; }
  .card h3 { font-size: 16px; }
  .meta, .guest, time, .src { color: var(--dim); font-size: 12px; letter-spacing: 0.06em; }
  .head { display: flex; justify-content: space-between; gap: 8px; }
  .guest { color: var(--green); margin-bottom: 6px; }
  .card p, .lead p, .row p {
    margin: 6px 0;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .open { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
  .stack, .watch, .map, .list { display: grid; gap: 10px; }
  .watch { display: block; }
  .map { grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); }
  .section { margin-top: 8px; }
  .section.shut .section-body { display: none; }
  .section-head { align-items: baseline; margin: 0; }
  .section-head .sec-title { color: var(--green); font-family: "VT323", ui-monospace, monospace; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .section-head .sec-sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-head .pm { color: var(--green); }
  .order-line, .watch-line { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; border-bottom: 1px dotted var(--line); padding: 6px 0; }
  .order-line h3, .watch-line h3 { margin: 0; font-size: 14px; font-weight: 400; }
  .order-line .so, .watch-line .so { grid-column: 1 / -1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .read { margin: 6px 0 0; padding-left: 18px; }
  .read li { margin: 8px 0; color: var(--bright); }
  .stat { display: flex; justify-content: space-between; gap: 12px; width: 100%; background: transparent; border: 0; border-bottom: 1px dotted var(--line); padding: 7px 0; text-align: left; cursor: pointer; }
  .stat.on { outline: 1px solid var(--green); }
  .break { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .fold-btn, .more, .legend-btn { width: 100%; display: flex; justify-content: space-between; gap: 8px; background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 8px; margin: 6px 0; text-align: left; }
  .fold-btn span, .sev { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .fold-body { margin: 0 0 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--dim); font-size: 12px; margin: 8px 0; }
  .legend i { margin-right: 4px; }
  .led.off { background: transparent; box-shadow: none; border: 1px solid var(--dim); }
  #tip { position: fixed; z-index: 60; max-width: 240px; background: #000; color: var(--bright); border: 1px solid var(--green); padding: 6px 8px; font-size: 12px; pointer-events: none; display: none; }
  #tip a { pointer-events: auto; }
  .stat b { color: var(--green); }
  .stat b.off { background: var(--green); color: #000; padding: 0 4px; }
  .sev { display: inline-block; padding: 0 6px; letter-spacing: 0.12em; font-size: 12px; }
  .sev-standby { color: var(--dim); border: 1px solid var(--dim); }
  .sev-alert { color: var(--bright); border: 1px solid var(--green); }
  .sev-action { background: var(--green); color: #000; }
  .sev-critical { background: var(--green); color: #000; animation: blink 1.1s steps(1) infinite; }
  .priors { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .priors li { padding: 8px; border-left: 2px solid var(--green); color: var(--ink); }
  .priors strong { color: var(--green); font-weight: 400; }
  .node { display: block; padding: 10px; text-decoration: none; color: inherit; min-height: 92px; }
  .node:hover { border-color: var(--green); }
  .node b { display: block; color: var(--green); letter-spacing: 0.08em; }
  .led { display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--dim); box-shadow: 0 0 6px var(--dim); }
  .led.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .led.stale { background: var(--dim); box-shadow: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chips button, .tabs button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 5px 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .chips button.on, .tabs button.on { border-color: var(--green); color: var(--green); }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .row { padding: 8px 10px; }
  .row h3 { margin: 2px 0; font-size: 15px; font-weight: 400; }
  .empty { color: var(--dim); border: 1px dashed var(--line); padding: 12px; }
  .bars { display: grid; gap: 6px; }
  .barline { display: grid; grid-template-columns: 52px 1fr 36px; gap: 8px; align-items: center; padding: 4px 8px; }
  .bar { height: 8px; background: #102013; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .ranges { margin-top: 12px; grid-column: 1 / -1; }
  .group { margin: 14px 0 6px; color: var(--bright); font-family: "VT323", ui-monospace, monospace; font-size: 22px; letter-spacing: 0.06em; }
  .venue { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-bottom: 1px dotted var(--line); padding: 6px 0; }
  .open { letter-spacing: 0.14em; }
  .pill-open { background: var(--green); color: #000; padding: 0 6px; }
  .pill-closed { border: 1px solid var(--dim); color: var(--dim); padding: 0 6px; }
  .plot { width: 100%; height: auto; background: #000; border: 1px solid var(--line); }
  .plot .land { fill: #06210c; stroke: var(--dim); stroke-width: 0.6; }
  .assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(160px, 100%), 1fr)); gap: 8px; }
  .spark { width: 100%; height: 36px; }
  .note-plain { color: var(--dim); font-size: 12px; }
  .markets, .threats, .labs { display: grid; gap: 10px; }
  @media (min-width: 801px) {
    .markets { grid-template-columns: 1fr 1fr; }
  }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .foot { margin-top: 28px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .err { color: var(--green); font-size: 12px; }
  .brief { border: 1px solid var(--line); padding: 12px 14px; margin: 0 0 8px; color: var(--bright); line-height: 1.45; }
  .so { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .arrow { color: var(--green); letter-spacing: 0.04em; }
  @media (max-width: 800px) {
    .front, .split, .mast { grid-template-columns: 1fr; }
    .tools { justify-content: flex-start; flex-wrap: wrap; }
    .paper { margin: 8px; overflow-x: clip; }
    .wordmark { letter-spacing: 0.03em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor, .sev-critical { animation: none; }
  }

feinated coffee daily was linked to a dramatically lower risk of dementia and better cognitive functioning in a study spanning up to 43 years. The benefits appeared regardless of genetic risk, but decaffeinated coffee did not show the same association.", "url": "https://www.sciencedaily.com/releases/2026/11/261105224550.htm", "published": "2026-11-07T04:16:19-06:00", "date": "2026-11-07", "label": "Nov 7, 2026 4:16 AM CT", "weekday": "Sat", "timeKnown": true, "tags": ["science", "biomedical", "news"], "field": "biomedical", "review": "NEWS", "severity": ""}, {"id": "paper:129540e30f54095c", "kind": "paper", "lane": "science", "source": "NASA", "sourceId": "paper", "title": "APOD: 2026 November 7 – De Gerlache-Kocher Massif", "guest": "", "note": "APOD Science APOD APOD: 2026 November 7 –… Today’s APOD Archive Submissions Index Search Calendar RSS Education About Discuss APOD Astronomy Picture of the Day Discover the cosmos! Each day a different image or photograph of our fascinating universe is featured, along with a brief explanation written by a professional astronomer.", "url": "https://science.nasa.gov/image-article/apod-2026-november-7-de-gerlache-kocher-massif/", "published": "2026-11-06T23:05:00-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 11:05 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "propulsion", "news"], "field": "propulsion", "review": "NEWS", "severity": ""}, {"id": "paper:c1ed831cdf0bbbcb", "kind": "paper", "lane": "science", "source": "Phys.org physics", "sourceId": "paper", "title": "Air holes turn silicon wafers into flat ultraviolet focusing mirrors for compact optics", "guest": "", "note": "Traditional lenses and mirrors focus light using curved surfaces. Metasurfaces can achieve similar functions with a flat layer of nanoscale structures that locally control the phase of light.", "url": "https://phys.org/news/2026-11-air-holes-silicon-wafers-flat.html", "published": "2026-11-06T16:00:01-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 4:00 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "physics", "news"], "field": "physics", "review": "NEWS", "severity": ""}, {"id": "paper:6f4f7e109742a88e", "kind": "paper", "lane": "science", "source": "Phys.org physics", "sourceId": "paper", "title": "Quantum gas microscope reveals individual atoms in first tunable three-component Hubbard system", "guest": "", "note": "For the first time, an international team of researchers from Germany, Thailand, India, China and the United States has created a three-component Hubbard system with tunable interactions in the laboratory. In doing so, the team used a quantum gas microscope to make the individual atoms visible.", "url": "https://phys.org/news/2026-11-quantum-gas-microscope-reveals-individual.html", "published": "2026-11-06T14:20:01-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 2:20 PM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "physics", "news"], "field": "physics", "review": "NEWS", "severity": ""}, {"id": "paper:7e51b6123ae5d005", "kind": "paper", "lane": "science", "source": "Phys.org physics", "sourceId": "paper", "title": "Scientists achieve record-breaking low temperature on China's space station, paving the way for new physics experiments", "guest": "", "note": "Matter starts to behave differently at extremely low temperatures, creating conditions ideal for studying quantum physics and new states of matter. Now, researchers from China have achieved a new low-temperature record aboard their Tiangong space station.", "url": "https://phys.org/news/2026-11-scientists-temperature-china-space-station.html", "published": "2026-11-06T11:00:17-06:00", "date": "2026-11-06", "label": "Nov 6, 2026 11:00 AM CT", "weekday": "Fri", "timeKnown": true, "tags": ["science", "physics", "news"], "field": "physics", "review": "NEWS", "severity": ""}, {"id": "paper:f16dfa763532e433", "kind": "paper", "lane": "science", "source": "NASA", "sourceId": "paper", "title , "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:4c64f646d9e3b27d", "kind": "paper", "lane": "science", "source": "arXiv quant-ph", "sourceId": "paper", "title": "Provable circuit-level thresholds for non-abelian topological phases", "guest": "", "note": "We provide an explicit scheme to realize a quantum memory in any 2D non-chiral topological order. For this, we construct syndrome extraction circuits based on the Turaev-Viro path integral as well as a classical algorithm for decoding on the fly.", "url": "https://arxiv.org/abs/2611.08488v1", "published": "2026-11-05T12:59:44-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 12:59 PM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "quantum", "preprint"], "field": "quantum", "review": "PREPRINT", "severity": ""}, {"id": "paper:e29ed6f99bd65e84", "kind": "paper", "lane": "science", "source": "arXiv cs.AI", "sourceId": "paper", "title": "SwarmEvolve: Latent Agent Swarms for Evolutionary Discovery and Optimization", "guest": "", "note": "LLM-guided evolutionary search uses AI agents to improve programs for mathematical and computational problems by iteratively refining solutions and combining high-scoring methods. However, the process is often slow because the LLM generates a long textual chain of thought for each round and must repeat this generation many times to maintain population diversity.", "url": "https://arxiv.org/abs/2611.08483v1", "published": "2026-11-05T12:59:29-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 12:59 PM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "ai", "preprint"], "field": "ai", "review": "PREPRINT", "severity": ""}, {"id": "paper:adc428fb838640a9", "kind": "paper", "lane": "science", "source": "arXiv cs.AI", "sourceId": "paper", "title": "Scientist World: Grow a Research World for AI-Scientists", "guest": "", "note": "AI-Scientists arrived, but a world for them to grow in did not. Human scientists take theirs for granted $-$ centuries of open problems and shared ideas, waiting in the scientific literature.", "url": "https://arxiv.org/abs/2611.08478v1", "published": "2026-11-05T12:58:17-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 12:58 PM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "ai", "preprint"], "field": "ai", "review": "PREPRINT", "severity": ""}, {"id": "paper:fac4225a80cb6327", "kind": "paper", "lane": "science", "source": "arXiv gr-qc / hep-th", "sourceId": "paper", "title": "Defect Anomalies at a Distance", "guest": "", "note": "Surface defects carry Weyl and gravitational anomalies that generalize the central charges of two-dimensional conformal field theories (CFTs) and characterize the anomalous response of gapless surface modes to background geometry. These anomalies usually appear as contact terms on the defect.", "url": "https://arxiv.org/abs/2611.08476v1", "published": "2026-11-05T12:57:59-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 12:57 PM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "physics", "preprint"], "field": "physics", "review": "PREPRINT", "severity": ""}, {"id": "paper:c02bc5551d4969fc", "kind": "paper", "lane": "science", "source": "arXiv cs.AI", "sourceId": "paper", "title": "XStack: A Benchmark for ML Repo Migration", "guest": "", "note": "ML code should run where researchers choose, not where it was first written. Today, machine learning code mainly lives in two ecosystems, PyTorch on NVIDIA GPUs and JAX on Google TPUs.", "url": "https://arxiv.org/abs/2611.08472v1", "published": "2026-11-05T12:55:54-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 12:55 PM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "ai", "preprint"], "field": "ai", "review": "PREPRINT", "severity": ""}, {"id": "paper:da8433beb995c5fc", "kind": "paper", "lane": "science", "source": "arXiv gr-qc / hep-th", "sourceId": "paper", "title": "The three-dimensional Galilean black hole", "guest": "", "note": "We report the CMB temperature as a test of energy exchange in Einstein-Cartan cosmology", "guest": "", "note": "The cosmic microwave background temperature at $z=0.886$ is known to $2\\%$ from molecular absorption towards PKS~1830$-$211; CO absorbers and Sunyaev-Zel'dovich clusters extend the measurement to $z\\simeq3$. We use them on a question that cosmologies with torsion leave open.", "url": "https://arxiv.org/abs/2611.08422v1", "published": "2026-11-05T12:19:36-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 12:19 PM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "physics", "preprint"], "field": "physics", "review": "PREPRINT", "severity": ""}, {"id": "paper:d84262f1b1ebe179", "kind": "paper", "lane": "science", "source": "arXiv gr-qc / hep-th", "sourceId": "paper", "title": "Algorithmic Construction of Vector-Valued Modular Forms and Application to an $A_4\\times\\mathbb{Z}_4$-invariant Model of Leptons", "guest": "", "note": "We present an algorithmic procedure that constructs the Vector-Valued Modular Forms (VVMFs) of finite modular groups, as well as its implementation in a companion code. The usual method consists in building the first few VVMFs, whose tensor products then generate the others.", "url": "https://arxiv.org/abs/2611.08387v1", "published": "2026-11-05T12:04:52-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 12:04 PM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "physics", "preprint"], "field": "physics", "review": "PREPRINT", "severity": ""}, {"id": "paper:9f98ec3e3d4dc32c", "kind": "paper", "lane": "science", "source": "Google AI blog", "sourceId": "paper", "title": "Gemini Omni 1.2 Flash: Fast and cost-effective with longer clips", "guest": "", "note": "Gemini Omni 1.2 Flash brings native 15-second video generation and editing, stronger consistency, and 30% lower pricing.", "url": "https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemini-omni-1-2-flash/", "published": "2026-11-05T11:00:00-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 11:00 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "ai", "news"], "field": "ai", "review": "NEWS", "severity": ""}, {"id": "paper:f2a6f3b69acf65b0", "kind": "paper", "lane": "science", "source": "IEEE Spectrum", "sourceId": "paper", "title": "Use Your Year-End Review to Reach for a Promotion", "guest": "", "note": "Sign up now to get insider tips, expert advice, and practical strategies, written i n partnership with tech career development company Parsity and delivered to your inbox for free! When I landed my first job as a software engineer, I had a simple plan: Work hard and somebody would notice.", "url": "https://spectrum.ieee.org/how-to-get-a-promotion", "published": "2026-11-05T10:08:03-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 10:08 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:babab1b4d539a05e", "kind": "paper", "lane": "science", "source": "arXiv physics.space-ph", "sourceId": "paper", "title": "Charge Retention in Lunar Regolith: Microscopic Processes and Constraints on Subsurface Charging", "guest": "", "note": "Energetic-particle irradiation can produce persistent charge separation within lunar regolith, but the internal fields predicted by subsurface-charging models depend on how particle interactions are translated into retained charge. This critical review examines the evidence and assumptions connecting microscopic charge formation to macroscopic charging.", "url": "https://arxiv.org/abs/2611.08062v1", "published": "2026-11-05T08:15:48-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 8:15 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "propulsion", "preprint"], "field": "propulsion", "review": "PREPRINT", "severity": ""}, {"id": "paper:13075218579040e9", "kind": "paper", "lane": "science", "source": "IEEE Spectrum", "sourceId": "paper", "title": "Why a Mathematician Is Chasing Eclipses With Algorithms and Cameras", "guest": "", "note": "The sun hangs low over the plains of Castile and León, in the north-central region of Spain. But from a slope of the mountain Pico Trigaza , it appears that a few puffy white clouds have started to block the sun.", "url": "https://spectrum.ieee.org/2026-solar-eclipse", "published": "2026-11-05T08:00:02-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 8:00 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:43a6929e5a1b90fa", "kind": "paper", "lane": "science", "source": "MIT Technology Review", "sourceId": "paper", "title": "The Download: Texas’s fragile AI boom and energy policy shifts", "guest": "", "note": "Texas was the new epicenter of the AI data center buildout.", "url": "https://www.technologyreview.com/2026/11/05/1144908/the-download-texas-fragile-ai-boom-us-energy-policy/", "published": "2026-11-05T07:10:00-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 7:10 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:1ced3385755907bc", "kind": "paper", "lane": "science", "source": "MIT Technology Review", "sourceId": "paper", "title": "A new bill could change how the US builds energy infrastructure", "guest": "", "note": "A sweeping bit of legislation designed to cut red tape could speed up the buildout of energy infrastructure in the US. With the dust barely settled on this week’s momentous midterms, the Senate is set to vote on the Bipartisan American Affordability and Jobs Act (BAAJA) on November 9.", "url": "https://www.technologyreview.com/2026/11/05/1148062/permitting-reform/", "published": "2026-11-05T04:00:00-06:00", "date": "2026-11-05", "label": "Nov 5, 2026 4:00 AM CT", "weekday": "Thu", "timeKnown": true, "tags": ["science", "technology", "news"], "field": "technology", "review": "NEWS", "severity": ""}, {"id": "paper:ab636a2614418542", "kind": "paper", "lane": "science", "source": "Google AI blog", "sourceId": "paper", "title": "The latest AI news we announced in October 2026", "guest": "", "note": "Here are Google’s latest AI updates from October 2026", "url": "https://blog.google/innovation-and-ai/technology/ai/google-ai-updates-october-2026/", "published": "2026-11-02T11:45:00-06:00", "date": "2026-11-02", "label": "Nov 2, 2026 11:45 AM CT", "weekday": "Mon", "timeKnown": true, "tags": ["science", "ai", "news"], "field": "ai", "review": "NEWS", "severity": ""}, {"id": "paper:dc7707ac7b67a65a", "kind": "paper", "lane": "science", "source": "arXiv physics.space-ph", "sourceId": "paper", "title": "A heteroskedasticity and autocorrelation consistent test for process noise calibration of Kalman filters in multi-sensor orbit determination", "guest": "", "note": "Process noise calibration is a central problem in sequential orbit determination. If the process noise covariance is too small the filter is overconfident, and if it is too large it is overconservative.", "url": "https://arxiv.org/abs/2611.03477v1", "published": "2026-11-02T11:18:03-06:00", "date": "2026-11-02", "label": "Nov 2, 2026 11:18 AM CT", "weekday": "Mon", "timeKnown": true, "tags": ["science", "propulsion", "preprint"], "field": "propulsion", "review": "PREPRINT", "severity": ""}, {"id": "paper:6000b74f175acba1", "kind": "paper", "lane": "science", "source": "arXiv physics.space-ph", "sourceId": "paper", "title": "Solar Wind Turbulence Spectra and Correlation Scale from 4 to 50 $r_\\odot$: STEREO and PUNCH Observations", "guest": "", "note": "We investigate the radial evolution of solar wind turbulence using remote-sensing brightness observations from the Solar Terrestrial Relations Observatory (STEREO) and the first science-ready images from the Polarimeter to Unify the Corona and Heliosphere (PUNCH) mission. Exploiting the combined wide fields of view of STEREO's COR2 coronagraph (4-9 r_sun) and PUNCH's Wide Field Imager (WFI, 21-50 r_sun), we track the radial evolution of the power spectral density and correlation scale of density", "url": "https://arxiv.org/abs/2611.03328v1", "published": "2026-11-02T09:49:51-06:00", "date": "2026-11-02", "label": "Nov 2, 2026 9:49 AM CT", "weekday": "Mon", "timeKnown": true, "tags": ["science", "propulsion", "preprint"], "field": "propulsion", "review": "PREPRINT", "severity": ""}, {"id": "paper:f68006ee0a450848", "kind": "paper", "lane": "science", "source": "arXiv physics.space-ph", "sourceId": "paper", "title": "Structure of energy flux densities in Earth's magnetotail reconnection regions: Bridging simulation and observation", "guest": "", "note": "Magnetic reconnection is important in both space and laboratory contexts because it changes the topology of magnetic fields and converts magnetic energy into particle energies. Establishing where this energy conversion occurs is critical for understanding how reconnection partitions energy.", "url": "https://arxiv.org/abs/2611.02870v1", "published": "2026-11-02T04:09:58-06:00", "date": "2026-11-02", "label": "Nov 2, 2026 4:09 AM CT", "weekday": "Mon", "timeKnown": true, "tags": ["science", "propulsion", "preprint"], "field": "propulsion", "review": "PREPRINT", "severity": ""}, {"id": "paper:1b9c994fdd1de800", "kind": "paper", "lane": "science", "source": "bioRxiv", "sourceId": "paper", "title": "Lymphangiogenesis is Critical for Healing and Survival in a Murine Model of Laryngotracheal Injury", "guest": "", "note": "Objective: Lymphatic dysfunction has been implicated in exacerbating fibrosis in numerous diseases, yet the role of the lymphatic system in laryngotracheal injury has not previously been explored. This study aims to evaluate lymphatic vascular remodeling in a murine model of laryngotracheal stenosis (LTS) and determine how pharmacologic blockade of lymphangiogenesis impacts airway healing after mucosal injury. Methods: LTS was induced in C57BL6 mice using an established chemomechanical injury mo", "url": "https://www.biorxiv.org/content/10.64898/2026.08.19.745806", "published": "2026-11-01T18:00:00-06:00", "date": "2026-11-01", "label": "Nov 1, 2026 6:00 PM CT", "weekday": "Sun", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:1f7a09eb5a92dd37", "kind": "paper", "lane": "science", "source": "bioRxiv", "sourceId": "paper", "title": "Head movement allocation in freely-moving macaques learning object-context sequences", "guest": "", "note": "Flexible learning and long-term memory are hallmark features of primate cognition that are shaped by interactions with changing environments. A comprehensive understanding of these brain-body-environment interactions requires minimal constraints on behavior, and environments rich with conditional cues that encourage diverse behavioral dynamics. In this study, we introduce a multi-level enclosure (Treehouse) that allows for independent control of spatially distributed touchscreens for studying co", "url": "https://www.biorxiv.org/content/10.1101/2023.12.11.571113", "published": "2026-11-01T18:00:00-06:00", "date": "2026-11-01", "label": "Nov 1, 2026 6:00 PM CT", "weekday": "Sun", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:5f5324fa14780f0f", "kind": "paper", "lane": "science", "source": "bioRxiv", "sourceId": "paper", "title": "A rational design strategy and validation for protease-resistant fusion-inhibitor antiviral peptides", "guest": "", "note": "Peptide-based fusion inhibitors are promising pharmaceuticals in the fight against enveloped viruses relying on membrane fusion for host infection. However, peptide therapeutic applications have long been hindered by their poor stability in vivo. Here, we discovered that peptide inhibitors with the wildtype sequence of the heptad repeat 2 (HR2) domain of the SARS-CoV-2 spike protein are efficiently cleaved by Transmembrane Protease, Serine 2 (TMPRSS2), a key protease involved in the SARS-CoV-2 v", "url": "https://www.biorxiv.org/content/10.64898/2026.09.12.750390", "published": "2026-11-01T18:00:00-06:00", "date": "2026-11-01", "label": "Nov 1, 2026 6:00 PM CT", "weekday": "Sun", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:6d3528d244aeb2cc", "kind": "paper", "lane": "science", "source": "bioRxiv", "sourceId": "paper", "title": "Regulatory plasticity of the rdar biofilm morphotype in clinical uropathogenic Escherichia coli and its modulation by ciprofloxacin", "guest": "", "note": "Background: Red, dry and rough (rdar) biofilm formation in Escherichia coli is characterized by the coordinated production of extracellular cellulose and amyloid curli fimbriae. Although rdar biofilm formation has been extensively characterized in laboratory strains, its clinical relevance and implications for antimicrobial treatment remain poorly understood. Methods: We screened 146 consecutive E. coli isolates from patients with urinary tract infections in Lahore, Pakistan (2017-2019) for Cong", "url": "https://www.biorxiv.org/content/10.64898/2026.04.22.719398", "published": "2026-11-01T18:00:00-06:00", "date": "2026-11-01", "label": "Nov 1, 2026 6:00 PM CT", "weekday": "Sun", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:6c7944ceedcc6b33", "kind": "paper", "lane": "science", "source": "medRxiv", "sourceId": "paper", "title": "Concordance with the MIND diet is associated with lower subsequent epigenetic aging", "guest": "", "note": "Abstract/SummaryHealthy dietary patterns may influence biological aging, but prospective evidence for the Mediterranean-DASH Intervention for Neurodegenerative Delay (MIND) diet is limited. We linked 2013 dietary data to 2016 DNA methylation measures in 1,740 Health and Retirement Study participants. Per 1-s.d. higher MIND score, adjusted differences were -0.4 years for PhenoAge acceleration (95% CI -0.8 to -0.1), -0.3 years for GrimAge acceleration (-0.5 to -0.1) and -0.0054 for methylation Pac", "url": "https://www.medrxiv.org/content/10.64898/2026.10.30.26365745", "published": "2026-11-01T18:00:00-06:00", "date": "2026-11-01", "label": "Nov 1, 2026 6:00 PM CT", "weekday": "Sun", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:a6d2d4eca1091dbb", "kind": "paper", "lane": "science", "source": "medRxiv", "sourceId": "paper", "title": "Comparative effectiveness of digital health interventions for low back pain: systematic review and network meta-analysis of randomised controlled trials", "guest": "", "note": "BackgroundDigital health interventions are increasingly used for low back pain, but their comparative effectiveness across different delivery modalities, clinical outcomes, and follow-up periods remains uncertain. We aimed to compare the effects of major digital health modalities for adults with low back pain.\n\nMethodsWe conducted a systematic review and frequentist random-effects network meta-analysis of randomised controlled trials. PubMed, Embase, CENTRAL, CINAHL, APA PsycINFO, ClinicalTrials", "url": "https://www.medrxiv.org/content/10.64898/2026.09.23.26363780", "published": "2026-11-01T18:00:00-06:00", "date": "2026-11-01", "label": "Nov 1, 2026 6:00 PM CT", "weekday": "Sun", "timeKnown": true, "tags": ["science", "biomedical", "preprint"], "field": "biomedical", "review": "PREPRINT", "severity": ""}, {"id": "paper:976a6aae5637ee38", "kind": "paper", "lane": "science", "source": "medRxiv", "sourceId": "paper", "title": "Exploring sex-dependent responses to anodal tDCS in subacute stroke rehabilitatio function fmtNum(value) {
  if (value === null || value === undefined || value === "") return "n/a";
  const num = Number(value);

  return num.toLocaleString("en-US", { maximumFractionDigits: 2 });
}
function zonedParts(date, timeZone) {
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone, weekday: "short", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23"
  });
  return Object.fromEntries(fmt.formatToParts(date).map((part) => [part.type, part.value]));
}
function zonedToUtc(year, month, day, hour, minute, timeZone) {
  let utc = Date.UTC(year, month - 1, day, hour, minute);
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
  });
  for (let i = 0; i < 3; i += 1) {
    const parts = Object.fromEntries(fmt.formatToParts(new Date(utc)).map((part) => [part.type, part.value]));
    const shown = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute);
    utc += Date.UTC(year, month - 1, day, hour, minute) - shown;
  }
  return new Date(utc);
}
function ctClock(date) {
  return new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Chicago", hour: "numeric", minute: "2-digit", hourCycle: "h12"
  }).format(date) + " CT";
}
function venueStatus(venue, now) {
  const zone = venue.timezone || "UTC";
  const parts = zonedParts(now, zone);
  const ymd = `${parts.year}-${parts.month}-${parts.day}`;
  const weekend = parts.weekday === "Sat" || parts.weekday === "Sun";
  const holiday = (venue.holidays || []).includes(ymd);
  const sessions = (venue.sessions || []).map((session) => {
    const [oh, om] = session.open.split(":").map(Number);
    const [ch, cm] = session.close.split(":").map(Number);
    const openAt = zonedToUtc(+parts.year, +parts.month, +parts.day, oh, om, zone);
    const closeAt = zonedToUtc(+parts.year, +parts.month, +parts.day, ch, cm, zone);
    return { openAt, closeAt };
  });
  const open = !weekend && !holiday && sessions.some((session) => now >= session.openAt && now < session.closeAt);
  const hours = sessions.map((session) => `${ctClock(session.openAt)}–${ctClock(session.closeAt)}`).join(", ");
  let why = open ? "OPEN" : "CLOSED";
  if (holiday) why = "CLOSED · holiday";
  else if (weekend) why = "CLOSED · weekend";
  return { open, why, hours };
}
function sparkline(points) {
  const vals = (points || []).map((point) => Number(point.price)).filter((num) => Number.isFinite(num));
  if (vals.length < 2) return "";
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const span = max - min || 1;
  const coords = vals.map((value, index) => {
    const x = (index / (vals.length - 1)) * 100;
    const y = 32 - ((value - min) / span) * 28;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg class="spark" viewBox="0 0 100 36" preserveAspectRatio="none"><polyline fill="none" stroke="#39ff14" stroke-width="1.5" points="${coords}"/></svg>`;
}

function project(lat, lon) {

function twoDayPct(asset) {
  const pts = (asset.points || []).filter((point) => point && point.price != null && point.date);
  if (pts.length < 3) return null;

  const prior = Number(pts[pts.length - 3].price);

    return dir === "up"
      ? "Crypto often swings harder than gold on the same headline."
      : "A sharp crypto drop often tracks a rush out of risk, and it can reverse in a day.";

function marketBullets() {

    bullets.push(`${tape.title}. Stocks set the tape. Crypto moved with that risk-off day, not because of an unrelated headline. ${tape.soWhat}`);
  }
  const recent = [];
  ((DESK.assets || {}).series || []).forEach((asset) => {
    const day = asset.changePct == null ? null : Number(asset.changePct);
    const two = twoDayPct(asset);
    const useTwo = two != null && (day == null || Math.abs(two) >= Math.abs(day));
    const move = useTwo ? two : day;
    if (move == null || Math.abs(move) < 1) return;
    const dir = move > 0 ? "up" : "down";
    const span = useTwo ? "in two days" : "today";
    const hook = recent.map((item) => item.title || "").find((title) => title.length <= 90 && !/analysis|implications|opinion|explainer|what we know/i.test(title));
    const after = !tape && hook ? ` after ${hook}` : "";

    const action = big
      ? "What to do: no action. A metal move is not a shelter order."
      : "What to do: no action.";
    const meaning = tape ? "It moved with the stock tape." : meaningOf(asset.name, dir);

function returnsOf(points) {
  const out = {};
  let prev = null;
  (points || []).forEach((point) => {
    if (!point || point.price == null || !point.date) return;
    const price = Number(point.price);
    if (prev) out[point.date] = ((price / prev) - 1) * 100;
    prev = price;
  });
  return out;
}

  if (kind === "conflict") return "war";

}
function insightHtml() {
  const byCat = {};
  ((DESK.threats || {}).items || []).forEach((item) => {
    const cat = catOf(item);
    if (!cat || !item.date) return;
    (byCat[cat] = byCat[cat] || new Set()).add(item.date);
  });
  const hits = [];
  ((DESK.assets || {}).series || []).forEach((asset) => {
    const rets = returnsOf(asset.points || []);
    const days = Object.keys(rets).sort().slice(-90);
    const windowDays = new Set(days);
    Object.keys(byCat).forEach((cat) => {
      const used = [...byCat[cat]].filter((day) => windowDays.has(day) && rets[day] != null);
      if (used.length < 4) return;
      const down = used.filter((day) => rets[day] < -0.3).length;
      const up = used.filter((day) => rets[day] > 0.3).length;
      const side = down >= up ? "fell" : "rose";
      const n = down >= up ? down : up;
      if (n / used.length < 0.75) return;
      const confidence = used.length >= 6 && n / used.length >= 0.8 ? "medium" : "low";
      const action = confidence === "low"
        ? "What to do: no action. The count is too small to act on."
        : "What to do: no action from this count alone. Use the standing order if that threat is still open.";
      const label = cat === "war" ? "war-escalation" : cat;
      hits.push({
        score: (n / used.length) * Math.log(used.length),
        text: `Over 90 days, ${asset.name} ${side} on ${n} of ${used.length} ${label} days. Confidence: ${confidence}. ${action}`
      });
    });
  });
  hits.sort((a, b) => b.score - a.score);
  const top = hits.slice(0, 3);
  if (!top.length) return `<p class="meta">No meaningful link this period.</p>`;

}

    const title = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(event.title || "")}</a>` : esc(event.title || "");
    return `<article class="row"><h3>${title}</h3>${moves}</article>`;
  }).join("");
  return events || `<p class="meta">No major event with prices around it.</p>`;
}
function renderImpact() {
  const threats = ((DESK.threats || {}).items || []).filter((item) => Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lon))).filter(passes);
  const dots = threats.map((item) => {
    const [x, y] = project(item.lat, item.lon);
    const radius = item.severity === "CRITICAL" ? 8 : item.severity === "ACTION" ? 6 : item.severity === "ALERT" ? 4.5 : 3;
    const url = safeUrl(item.url);
    const title = esc(item.title || "");
    return `<a href="${esc(url)}" target="_blank" rel="noopener"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${radius}" fill="#39ff14"><title>${title}</title></circle></a>`;
  }).join("");
  const path = (DESK.world || {}).path || "";
  document.getElementById("impact").innerHTML = fold("show-map", `Map · ${threats.length} located events`, `<svg class="plot" viewBox="0 0 800 400" role="img" aria-label="World plot of located events"><path class="land" d="${path}"></path>${dots}</svg><p class="note-plain">Marker size follows the status: standby, alert, action, critical.</p>`, false);
  const cards = ((DESK.assets || {}).series || []).map((asset) => {
    const src = safeUrl(asset.source);
    const name = src ? `<a href="${esc(src)}" target="_blank" rel="noopener">${esc(asset.name)}</a>` : esc(asset.name);
    const change = asset.changePct === null || asset.changePct === undefined ? "n/a" : `${asset.changePct > 0 ? "+" : ""}${asset.changePct}%`;
    return `<article class="card" id="asset-${esc(asset.id || "")}"><div class="head"><b>${name}</b><span>${esc(change)}</span></div><div>${esc(fmtNum(asset.level))}</div>${sparkline((asset.points || []).slice(-8))}</article>`;
  }).join("");
  document.getElementById("assets").innerHTML = cards || empty("Quotes did not answer on this check.");
  document.getElementById("market-read").innerHTML = marketReadHtml();
  document.getElementById("insights").innerHTML = insightHtml();
  document.getElementById("correlations").innerHTML = fold("show-numbers", "Show the numbers", numberDumpHtml(), false);
  renderTimeline(threats);
}
function renderTimeline(events) {
  const host = document.getElementById("timeline");
  const series = ((DESK.assets || {}).series || []).filter((asset) => (asset.points || []).length >= 2);
  if (!series.length) {
    host.innerHTML = empty("No price history to plot.");
    return;
  }
  const width = 640;
  const height = 180;
  const left = 36;
  const right = 12;
  const top = 16;
  const bottom = 28;
  const legend = series.map((asset) => {
    const off = state.assetsOff.includes(asset.id);
    return `<button type="button" class="legend-btn" data-asset="${esc(asset.id)}" aria-pressed="${off ? "false" : "true"}">${off ? "○" : "●"} ${esc(asset.name)}</button>`;
  }).join("");
  const visible = series.filter((asset) => !state.assetsOff.includes(asset.id));
  const lines = visible.map((asset) => {
    const pts = asset.points.slice(-30);
    const start = Number(pts[0].price) || 1;
    const coords = pts.map((point, i) => {
      const x = left + (i / (pts.length - 1)) * (width - left - right);
      const pct = ((Number(point.price) / start) - 1) * 100;
      const y = 90 - Math.max(-60, Math.min(60, pct * 1.6));
      return { x, y, point, pct, asset };
    });
    const poly = coords.map((dot) => `${dot.x.toFixed(1)},${dot.y.toFixed(1)}`).join(" ");
    const dots = coords.map((dot) => `<circle cx="${dot.x.toFixed(1)}" cy="${dot.y.toFixed(1)}" r="3.2" fill="#39ff14" data-tip="${esc(asset.name)} · ${esc(dot.point.date)} · ${esc(fmtNum(dot.point.price))} (${dot.pct >= 0 ? "+" : ""}${dot.pct.toFixed(1)}% from start)"></circle>`).join("");
    return `<polyline fill="none" stroke="#39ff14" stroke-width="1.4" points="${poly}"></polyline>${dots}`;
  }).join("");
  const newest = Date.now();
  const oldest = newest - 30 * 86400000;
  const marks = events.slice(0, 20).map((item) => {
    const t = Date.parse(item.published || "");
    if (!Number.isFinite(t) || t < oldest || t > newest) return "";
    const x = left + ((t - oldest) / (newest - oldest)) * (width - left - right);
    const url = safeUrl(item.url);
    const tip = esc(item.title || "Event");
    return `<a href="${esc(url)}" target="_blank" rel="noopener" data-tip="${tip}"><line x1="${x.toFixed(1)}" y1="${top}" x2="${x.toFixed(1)}" y2="${height - bottom}" stroke="#1f7a32" stroke-width="6" stroke-opacity="0.35"></line><line x1="${x.toFixed(1)}" y1="${top}" x2="${x.toFixed(1)}" y2="${height - bottom}" stroke="#7dff6b" stroke-width="1"></line></a>`;
  }).join("");
  const firstDate = (visible[0] && visible[0].points.slice(-30)[0].date) || "";
  const lastDate = (visible[0] && visible[0].points.slice(-1)[0].date) || "";
  host.innerHTML = fold("show-lines", "Price lines", `<p class="note-plain">Each line is the move from the first close on the chart. Vertical marks are events. Not a forecast.</p><div class="legend">${legend}</div><svg class="plot" viewBox="0 0 ${width} ${height}" role="img" aria-label="Asset moves versus events"><text x="4" y="96" fill="#1f7a32" font-size="10" transform="rotate(-90 8 96)">% from start</text><text x="${left}" y="${height - 8}" fill="#1f7a32" font-size="10">${esc(firstDate)}</text><text x="${width - 90}" y="${height - 8}" fill="#1f7a32" font-size="10">${esc(lastDate)}</text>${marks}${lines}</svg>`, false);
}
function labCard(item) {
  const review = item.review || "NEWS";
  const klass = review === "PEER-REVIEWED" ? "sev-action" : review === "PREPRINT" ? "sev-alert" : "sev-standby";
  return row(item).replace("<article class=\"row\">", `<article class="row"><span class="sev ${klass}">${esc(review)}</span> `);
}
function renderLabs() {
  const names = { physics: "Physics", propulsion: "Propulsion", biomedical: "Biomedical", quantum: "Quantum", technology: "Technology", ai: "AI" };
  const items = labItems();
  const html = Object.keys(names).map((field) => {
    const mine = items.filter((item) => item.field === field).sort((a, b) => Date.parse(b.published || 0) - Date.parse(a.published || 0));
    const top = mine.slice(0, 3).map((item) => esc(item.title)).join(" · ");
    const body = mine.length ? mine.map(labCard).filter(Boolean).join("") : `<p class="meta">None in this window.</p>`;
    const count = mine.filter((item) => labCard(item)).length;
    return fold("lab-" + field, `${esc(names[field])} · ${count}<span class="meta">${top ? " · " + top : ""}</span>`, body || `<p class="meta">None in this window.</p>`, false);
  }).join("");
  document.getElementById("labs").innerHTML = html || empty("No lab items in that window.");
}
function renderBoards() {
  renderMarkets();
  renderThreats();
  renderImpact();
  renderLabs();
}
function render() {
  claimed = new Set();
  const items = allItems();
  const desk = DESK;
  document.getElementById("checked").textContent = desk.updated
    ? `Sources checked ${desk.updated}. Window ${desk.retainDays || 120} days. Filter applies across the page.`
    : "Run python3 scripts/fetch.py && python3 build.py";
  const banner = document.getElementById("xbanner");
  const offline = !(desk.x && desk.x.online);
  banner.hidden = !offline;
  banner.textContent = offline ? "X feed offline" : "";
  renderStatus(items);
  renderBrief();
  renderToday();
  renderLocal();
  renderTriggers();
  renderOrders();
  renderWatch();
  renderChanged();
  renderBoards();
  renderRadar();
  renderLookback();
  renderMap();
  renderChips(items);
  renderCasebook();
  renderPanel();
  paintSections();
  bindDesk();
  const errs = desk.errors || [];
  document.getElementById("errs").textContent = errs.length ? errs.join(" · ") : "";
  const xReason = (desk.x && desk.x.reason) || "";
  const xLine = offline ? "X feed offline." : "X public posts are on.";
  document.getElementById("foot").textContent =
    `Times are America/Chicago. Notes come from the source. A blank quote means that feed did not answer. This is not a forecast or a trade instruction. ${xLine} Direct messages are never requested.`;
}
function showTip(event) {
  const tip = document.getElementById("tip");
  const text = event.currentTarget.getAttribute("data-tip");
  if (!tip || !text) return;
  tip.textContent = text;
  tip.style.display = "block";
  tip.style.left = Math.min(window.innerWidth - 250, event.clientX + 12) + "px";
  tip.style.top = Math.min(window.innerHeight - 80, event.clientY + 12) + "px";
}
function hideTip() {
  const tip = document.getElementById("tip");
  if (tip) tip.style.display = "none";
}
function bindDesk() {
  document.querySelectorAll("[data-tip]").forEach((node) => {
    if (node.dataset.tipBound) return;
    node.dataset.tipBound = "1";
    node.addEventListener("mouseenter", showTip);
    node.addEventListener("mousemove", showTip);
    node.addEventListener("mouseleave", hideTip);
    node.addEventListener("click", showTip);
  });
}
function boot() {
  if (typeof DESK === "undefined") {
    document.getElementById("app").insertAdjacentHTML("beforeend", "<p class='empty'>This is the template. Run python3 build.py.</p>");
    return;
  }
  try {
    const saved = JSON.parse(localStorage.getItem("desk-ui") || "{}");
    state.open = saved.open || {};
    state.more = saved.more || {};
    state.focus = saved.focus || "";
    state.assetsOff = saved.assetsOff || [];
    if (saved.range) state.range = saved.range;
    if (saved.tab) state.tab = saved.tab;
    if (saved.field) state.field = saved.field;
  } catch (err) { /* ignore stored state */ }
  document.querySelectorAll("#ranges button").forEach((btn) => btn.classList.toggle("on", btn.dataset.range === state.range));
  document.querySelectorAll(".tabs button").forEach((btn) => {
    const on = btn.dataset.tab === state.tab;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.getElementById("app").addEventListener("click", (event) => {
    const fold = event.target.closest("[data-fold]");
    if (fold) {
      state.open[fold.dataset.fold] = fold.getAttribute("aria-expanded") !== "true";
      remember();
      render();
      return;
    }
    const more = event.target.closest("[data-more]");
    if (more) {
      state.more[more.dataset.more] = !state.more[more.dataset.more];
      remember();
      render();
      return;
    }
    const focus = event.target.closest("[data-focus]");
    if (focus) {
      state.focus = state.focus === focus.dataset.focus ? "" : focus.dataset.focus;
      remember();
      render();
      return;
    }
    const asset = event.target.closest("[data-asset]");
    if (asset) {
      const id = asset.dataset.asset;
      state.assetsOff = state.assetsOff.includes(id) ? state.assetsOff.filter((item) => item !== id) : state.assetsOff.concat(id);
      remember();
      render();
    }
  });
  document.getElementById("q").addEventListener("input", (event) => {
    state.q = event.target.value.trim().toLowerCase();
    render();
  });
  document.querySelectorAll("#ranges button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.range = btn.dataset.range || "all";
      document.querySelectorAll("#ranges button").forEach((el) => el.classList.toggle("on", el === btn));
      render();
    });
  });
  document.querySelectorAll(".tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      document.querySelectorAll(".tabs button").forEach((el) => {
        el.classList.toggle("on", el === btn);
        el.setAttribute("aria-selected", el === btn ? "true" : "false");
      });
      render();
    });
  });
  render();
}
boot();
</script>
