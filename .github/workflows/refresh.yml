name: Refresh desk

on:
  workflow_dispatch:
  schedule:
    # 13:15 UTC = 8:15 AM CT while daylight time is in effect (CDT, UTC-5).
    # After the fall time change this is 7:15 AM CT.
    - cron: "15 13 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-desk
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sources
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 scripts/fetch.py

      - name: Build and commit
        run: |
          set -euo pipefail
          python3 build.py
          git add -- data index.html
          if git diff --cached --quiet; then
            echo "Desk unchanged. Not committing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh desk $(TZ=America/Chicago date +%Y-%m-%d)"
          # Schedule runs on main, which is what republishes Pages (main / root).
          ref="${GITHUB_REF_NAME:-main}"
          if ! git push origin "HEAD:${ref}"; then
            git pull --rebase "origin" "${ref}"
            git push origin "HEAD:${ref}"
          fi
