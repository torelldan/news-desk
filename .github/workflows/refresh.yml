name: Refresh desk

on:
  workflow_dispatch:
  schedule:
    # GitHub delivers schedule events hours late on this repo. These are extra
    # attempts, roughly hourly from 09:00 through 16:00 UTC, on off-the-hour
    # minutes. 13:15 UTC is 7:15 AM CT in winter and 8:15 AM CT in summer.
    # The skip step below no-ops once Chicago's date already has a refresh commit.
    # workflow_dispatch stays on so a manual run can still start the job.
    - cron: "7 9 * * *"
    - cron: "17 10 * * *"
    - cron: "23 11 * * *"
    - cron: "37 12 * * *"
    - cron: "15 13 * * *"
    - cron: "41 14 * * *"
    - cron: "47 15 * * *"
    - cron: "53 16 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-desk
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Skip if today already refreshed
        if: github.event_name == 'schedule'
        run: |
          today=$(TZ=America/Chicago date +%Y-%m-%d)
          if git log -30 --pretty=%s | grep -qx "Refresh desk ${today}"; then
            echo "A refresh already committed for ${today}. Skipping this backup run."
            echo "SKIP_REFRESH=1" >> "$GITHUB_ENV"
          fi

      - name: Setup Python
        if: env.SKIP_REFRESH != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sources
        if: env.SKIP_REFRESH != '1'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 scripts/fetch.py

      - name: Build and commit
        if: env.SKIP_REFRESH != '1'
        run: |
          set -euo pipefail
          python3 build.py
          git add -- data index.html
          if git diff --cached --quiet; then
            echo "Desk unchanged. Not committing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh desk $(TZ=America/Chicago date +%Y-%m-%d)"
          # Schedule runs on main, which is what republishes Pages (main / root).
          ref="${GITHUB_REF_NAME:-main}"
          if ! git push origin "HEAD:${ref}"; then
            git pull --rebase "origin" "${ref}"
            git push origin "HEAD:${ref}"
          fi
